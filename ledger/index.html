      ${open?`<div class="plist">${list.map(p=>paperRow(p,q)).join("")}</div>`:""}</section>`;
  };
  let out = "", shown = 0, total = 0;
  if(mode==="splash"){
    const sp = topicBase(t, "splash"), a = sp.filter(p=>p.tier==="splash"), b = sp.filter(p=>p.tier!=="splash");
    total = a.length + b.length;
    const fa = a.filter(match).sort(byDate), fb = b.filter(match).sort(byDate); shown = fa.length + fb.length;
    out = band("sp","Made a splash","explicit evidence: an oral or spotlight, or major press", fa, false)
        + band("tv","Peer-reviewed at a top venue","since "+fmtYM(since), fb, false);
  } else {
    const base = topicBase(t, mode);
    total = base.length;
    const pool = base.filter(match).sort(byDate); shown = pool.length;
    if(topicGroup==="area"){
      const areas = [...new Set(pool.map(p=>p.area))].sort((x,y)=>pool.filter(p=>p.area===y).length - pool.filter(p=>p.area===x).length);
      out = areas.map((a,i)=>band("a:"+mode+":"+a, a, "", pool.filter(p=>p.area===a), i>0 && !q && !topicArea)).join("");
    } else {
      const months = [...new Set(pool.map(p=>String(p.date).slice(0,7)))];
      out = months.map((m,i)=>band("m:"+m, fmtYM(m), "", pool.filter(p=>String(p.date).slice(0,7)===m), i>1 && !q && !topicArea)).join("");
    }
  }
  box.innerHTML = out || `<div class="empty"><h3>Nothing matches</h3>Clear the search or the area filter.</div>`;
  const c = $("#topic-count"); if(c) c.textContent = shown===total ? total+" papers" : shown+" of "+total;
}

// ================= relevance: every signal decays, nothing is ever hidden =================
// A strict waterfall would let the first criterion decide everything; these combine and fade instead.
const DAY = 864e5;
function decay(ts, half){
  if(!ts) return 0;
  const a = (Date.now() - Date.parse(ts)) / DAY;
  if(!(a >= 0)) return 1;                       // a clock ahead of ours counts as "just now"
  return Math.pow(0.5, a / half);
}
function ago(ts){
  if(!ts) return "";
  const d = Math.floor((Date.now() - Date.parse(ts)) / DAY);
  return d<=0 ? "today" : d===1 ? "yesterday" : d<7 ? d+" days ago" : d<14 ? "last week"
       : d<60 ? Math.round(d/7)+" weeks ago" : "a while ago";
}
// the touch log: when you last OPENED something. Kept in the artifact so the order follows you across devices.
const touched = Object.create(null);
let touchDirty = false, touchTimer = null;
function touch(id){
  if(!id) return;
  touched[id] = new Date().toISOString();
  touchDirty = true;
  if(!touchTimer) touchTimer = setTimeout(flushTouch, 60000);   // at most one write a minute
}
async function flushTouch(){
  if(touchTimer){ clearTimeout(touchTimer); touchTimer = null; }
  if(!touchDirty || !db) return;
  touchDirty = false;
  const keep = Object.entries(touched).sort((a,b)=>String(b[1]).localeCompare(String(a[1]))).slice(0,400);
  try{ await db.doc("prefs/touch").set({seen:Object.fromEntries(keep), updatedAt:new Date().toISOString(), by:"page"}); }
  catch(err){ touchDirty = true; }
}
function mergeTouch(seen){                      // never let a stale snapshot overwrite a fresher local open
  for(const [k,v] of Object.entries(seen||{})) if(!touched[k] || String(v) > touched[k]) touched[k] = v;
}
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushTouch(); });
window.addEventListener("pagehide", flushTouch);

const SIGNALS = [
  ["touch",  130, 3,  it => touched[it.id],      t => "opened "+ago(t)],
  ["work",    90, 7,  it => it.statusChangedAt,  t => "you moved it "+ago(t)],
  ["keep",    60, 14, it => it.acceptedAt,       t => "kept "+ago(t)],
  ["agent",   50, 4,  it => it.agentUpdatedAt,   t => "Claude touched it "+ago(t)],
  ["new",     40, 10, it => it.addedAt,          t => "added "+ago(t)],
];
function scoreItem(it){
  if(!it) return 0;
  let s = SIGNALS.reduce((a,[,w,h,get])=>a + w*decay(get(it), h), 0);
  if(it.status==="reading") s *= 1.5;                       // the best predictor of coming back
  else if(it.status==="done" || it.status==="skimmed") s *= 0.4;
  return s;
}
function whyItem(it){
  const best = SIGNALS.map(([,w,h,get,say])=>[w*decay(get(it),h), say(get(it))])
                      .filter(x=>x[0] > 20).sort((a,b)=>b[0]-a[0])[0];   // a reason on every row would be noise
  return best ? best[1] : "";
}
const whyChip = txt => txt ? `<span class="why">${esc(txt)}</span>` : "";
// a section surfaces for its hottest item, with a little credit for breadth
function sectionWhy(list){
  const best = list.map(i=>[scoreItem(i), whyItem(i)]).filter(x=>x[1]).sort((a,b)=>b[0]-a[0])[0];
  const n = list.filter(i=>decay(touched[i.id],3) > 0.25).length;
  return n > 1 ? n+" opened recently" : (best ? best[1] : "");
}
function aggScore(list){
  if(!list.length) return 0;
  const s = list.map(scoreItem).sort((a,b)=>b-a), top = s.slice(0,5);
  return 0.6*s[0] + 0.4*(top.reduce((a,b)=>a+b,0)/top.length);
}
function progScore(p){
  const us = unitsOf(p.id);
  let s = 130*decay(touched["prog:"+p.id], 3);
  if(p.bookmark && p.bookmark.at) s = Math.max(s, 90*decay(p.bookmark.at, 7));
  for(const c of us) s = Math.max(s, 130*decay(touched[c.id],3), 90*decay(c.updatedAt,7),
                                    50*decay(c.agentUpdatedAt,4), 40*decay(c.addedAt||c.createdAt,10));
  const st = progStats(p.id);
  if(st.pct>0 && st.pct<100) s *= 1.5; else if(st.pct>=100) s *= 0.4;
  return s;
}
function whyProg(p){
  if(p.bookmark && p.bookmark.at && decay(p.bookmark.at,7) > 0.25) return "you were at "+String(p.bookmark.label||"your bookmark").slice(0,34);
  const us = unitsOf(p.id);
  const cand = [[130*decay(touched["prog:"+p.id],3), "opened "+ago(touched["prog:"+p.id])]];
  for(const c of us){
    cand.push([130*decay(touched[c.id],3), "opened "+ago(touched[c.id])]);
    cand.push([90*decay(c.updatedAt,7), "you ticked a step "+ago(c.updatedAt)]);
    cand.push([50*decay(c.agentUpdatedAt,4), "Claude touched it "+ago(c.agentUpdatedAt)]);
  }
  const best = cand.filter(x=>x[0] > 5).sort((a,b)=>b[0]-a[0])[0];
  return best ? best[1] : "";
}
function trackScore(e){
  let s = 130*decay(touched["track:"+e.key], 3);
  for(const m of e.members) s = Math.max(s, scoreItem(m.it));
  if(e.stats.sugg) s += 30;
  if(e.stats.reading) s *= 1.5;
  else if(e.stats.total && e.stats.read >= e.stats.total) s *= 0.4;
  return s;
}
function whyTrack(e){
  const t = touched["track:"+e.key];
  if(decay(t,3) > 0.4) return "opened "+ago(t);          // name the signal that actually put it here
  if(e.stats.sugg) return e.stats.sugg+" to review";
  if(decay(t,3) > 0.04) return "opened "+ago(t);
  const best = e.members.map(m=>[scoreItem(m.it), whyItem(m.it)]).filter(x=>x[1]).sort((a,b)=>b[0]-a[0])[0];
  return best ? best[1] : "";
}
function conceptScore(c){
  let s = SIGNALS.reduce((a,[,w,h,get])=>a + w*decay(get(c), h), 0);
  for(const k of items) if(k.ideaId===c.id) s = Math.max(s, scoreItem(k)*0.8);
  if(pendingOf(c.id).length) s += 30;
  if(c.priority==="high") s *= 1.2;
  if(c.status==="parked") s *= 0.3;
  return s;
}
function whyConcept(c){
  if(decay(touched[c.id],3) > 0.4) return "opened "+ago(touched[c.id]);
  const p = pendingOf(c.id).length;
  if(p) return p+" new to review";
  const own = whyItem(c);
  if(own) return own;
  const best = items.filter(k=>k.ideaId===c.id).map(k=>[scoreItem(k), whyItem(k)]).filter(x=>x[1]).sort((a,b)=>b[0]-a[0])[0];
  return best ? best[1] : "";
}

// ================= PATHS — programmes and reading tracks in one tab =================
let pathSel = store.get("ll.path", "");
let pathFixed = store.get("ll.pathFixed", false);
function progNext(pid){
  for(const c of unitsOf(pid)){
    const i = (c.lessons||[]).findIndex((_,k)=>!(c.done||[]).includes(k));
    if(i>=0) return (c.short||c.title)+" — "+((c.lessons||[])[i]||"");
  }
  return "";
}
function pathEntries(){
  const out = progList().map(p=>({kind:"prog", key:"prog:"+p.id, id:p.id, p, st:progStats(p.id)}));
  for(const e of trackEntries()) if(!e.t.tab) out.push({kind:"track", key:"track:"+e.key, id:e.key, e});
  if(!pathFixed) for(const x of out) x.rel = x.kind==="prog" ? progScore(x.p) : trackScore(x.e);
  return out;
}
function renderPaths(){
  const es = pathEntries();
  if(!es.length){
    $("#paths-switch").innerHTML = "";
    $("#paths-body").innerHTML = `<div class="empty"><h3>No path yet</h3>Ask Claude for a learning programme, or send it a list of sources to turn into a reading track.</div>`;
    return;
  }
  let cur = es.find(x=>x.key===pathSel) || es.find(x=>x.kind==="track" && x.e.stats.next) || es[0];
  pathSel = cur.key; store.set("ll.path", pathSel);
  let progs = es.filter(x=>x.kind==="prog"), trks = es.filter(x=>x.kind==="track");
  if(!pathFixed){ const byRel = (a,b)=>(b.rel||0)-(a.rel||0); progs = [...progs].sort(byRel); trks = [...trks].sort(byRel); }
  const tab = (x, on) => {
    if(x.kind==="prog"){
      const st = x.st, p = x.p, nx = progNext(p.id);
      const fresh = st.cs.some(c=>isNewFor("paths", c));

        <b>${esc(p.short||p.title)}${fresh?'<span class="tdot" title="New changes by Claude"></span>':""}</b>
        <span class="bar sm" aria-hidden="true"><i style="width:${st.pct}%;background:var(--done)"></i></span>
        <span class="pmeta">${st.pct}% · ${st.cs.length} ${esc(p.unit||"unit")}${st.cs.length===1?"":"s"}${st.wTot&&p.weightUnit?" · "+esc(fmtW(st.wTot,p.weightUnit)):""}${pathFixed?"":whyChip(whyProg(p))}</span>
        <span class="pnext${nx?"":" done"}">${nx?"Next: "+esc(nx):"Complete"}</span></button>`;
    }
    const st = x.e.stats, t = x.e.t;
    const fresh = x.e.members.some(m=>landedNew(m.it.id,"paths") || isNewFor("paths", m.it));
    const pc = st.total ? Math.round(st.read/st.total*100) : 0;
    const range = st.dmin ? (st.dmin===st.dmax ? DIFF[st.dmin] : DIFF[st.dmin]+" → "+DIFF[st.dmax]) : "";
    return `<button class="pathtab${on?" on":""}${x.e.pseudo?" pseudo":""}" data-path="${esc(x.key)}" aria-selected="${on}">
      <b>${esc(t.short||t.title)}${fresh?'<span class="tdot" title="Something new here"></span>':""}</b>
      ${progressBar(st,"sm")}
      <span class="pmeta">${pc}% · ${st.read}/${st.total} done${pathFixed?(st.sugg?" · "+st.sugg+" to review":""):whyChip(whyTrack(x.e))}</span>
      ${range?`<span class="pmeta">${esc(range)}</span>`:""}
      <span class="pnext${st.next?"":" done"}">${st.next?"Next: "+esc(st.next.it.title):"All done"}</span></button>`;
  };
  $("#paths-switch").innerHTML = `<div class="pathbar">
    ${progs.length?`<div class="pathlbl"><span>Programmes · weighted by real effort</span><span class="rule"></span>
      <button class="btn ghost" data-pathfixed="${pathFixed?0:1}" title="${pathFixed?"Order by what you were last doing":"Back to the order each path was given"}">${pathFixed?"Fixed order":"By relevance"}</button></div>
      <div class="pathgroup">${progs.map(x=>tab(x, x===cur)).join("")}</div>`:""}
    ${trks.length?`<div class="pathlbl"><span>Reading tracks · by step</span><span class="rule"></span></div>
      <div class="pathgroup">${trks.map(x=>tab(x, x===cur)).join("")}</div>`:""}
  </div>`;
  if(cur.kind==="prog"){ progSel = cur.id; store.set("ll.prog", progSel); renderLearning(); }
  else { renderTracks(); }
}

function libFiltered(){

  if(q) src = src.filter(i=>[i.title,i.author,i.note,i.prereq,(i.tags||[]).join(" "),themeIds(i).map(x=>themeOf(x)?.label||x).join(" ")].join(" ").toLowerCase().includes(q));
  if(filters.theme) src = src.filter(i=>themeIds(i).includes(filters.theme));
  if(filters.status) src = src.filter(i=>i.status===filters.status);

  if(filters.track) src = src.filter(i=> filters.track==="_none" ? !tracksOf(i).length : tracksOf(i).some(t=>t.id===filters.track));
  const dctx = filters.theme ? "theme:"+filters.theme : (filters.track && filters.track!=="_none" ? "track:"+filters.track : "");
  if(filters.diff) src = src.filter(i=>String(diffOf(i,dctx))===filters.diff);

function libRow(it, dctx, q){

  const el = $("#lib-list");
  el.className = libDense ? "dense" : "";
  if(!src.length){ el.innerHTML = `<div class="empty"><h3>Nothing matches</h3>Loosen a filter or clear the search.</div>`; return; }

  const head = (name, sub, extra) => `<span class="bname">${esc(name)}</span>${sub?`<span class="bdesc">${esc(sub)}</span>`:""}${extra||""}`;
  // outside the status view the sections start folded: the page opens as a one-screen index you click into
  const secs = []; const sec = (k, h, list, c) => { if(list.length) secs.push([k, h, list, c]); };
  let out = "";
  if(filters.group==="pickup"){
    const hot = src.filter(i=>i.status==="reading" || decay(touched[i.id],3) > 0.25);
    const r1 = src.filter(i=>!hot.includes(i));
    const fresh = r1.filter(i=>!touched[i.id] && (decay(i.addedAt,10) > 0.5 || decay(i.agentUpdatedAt,4) > 0.5));
    const rest = r1.filter(i=>!fresh.includes(i));
    out = (hot.length ? libBand("pk1", head("Where you left off","in progress, or opened in the last few days"), hot, dctx, q, false) : "")
        + (fresh.length ? libBand("pk2", head("New since you last looked","added or changed by Claude, not opened yet"), fresh, dctx, q, false) : "")
        + (rest.length ? libBand("pk3", head("Everything else","by relevance"), rest, dctx, q, true) : "");
  } else if(filters.group==="status"){
    const band = (k, st, name, desc) => {
      const list = src.filter(i=>st.includes(i.status));
      return list.length ? libBand(k, head(name, desc), list, dctx, q, k==="cool") : "";
    };
    out = band("hot",["reading"],"In progress","what you have open")
        + band("warm",["todo"],"Up next","not started")
        + band("cool",["skimmed","done"],"Behind you","done and quick passes");
  } else if(filters.group==="theme"){
    const ths = [...themes].sort((a,b)=>(a.order??99)-(b.order??99));
    for(const th of ths){
      const list = src.filter(i=>themeIds(i).includes(th.id));
      if(!list.length) continue;
      const whole = all.filter(i=>themeIds(i).includes(th.id));
      const r = whole.filter(isRead).length, n = whole.length;
      const st = {total:n, done:whole.filter(i=>i.status==="done").length, skimmed:whole.filter(i=>i.status==="skimmed").length, reading:whole.filter(i=>i.status==="reading").length};
      const bar = `<span class="thprog">${progressBar(st,"sm")}<span class="bsub">${r}/${n} done · ${n?Math.round(r/n*100):0}%</span></span>`;
      sec("th:"+th.id, head(th.label, th.description||"", bar + whyChip(sectionWhy(list))), list, "theme:"+th.id);
    }
    const orphan = src.filter(i=>!themeIds(i).length);
    sec("th:_none", head("Not yet classified","Claude sorts these when the ledger is next touched"), orphan, "");
  } else if(filters.group==="path"){
    for(const p of progList()){
      const ids = new Set(unitsOf(p.id).map(c=>c.sourceId).filter(Boolean));
      const list = src.filter(i=>ids.has(i.id));
      if(!list.length) continue;
      const st = progStats(p.id);
      sec("pp:"+p.id, head(p.short||p.title, "programme", `<span class="bsub">${st.pct}% · ${st.cs.length} ${esc(p.unit||"unit")}s</span>`), list, "");
    }
    for(const t of [...tracks].sort((a,b)=>(a.order??99)-(b.order??99))){
      const list = src.filter(i=>tracksOf(i).some(x=>x.id===t.id));
      if(!list.length) continue;
      const whole = all.filter(i=>tracksOf(i).some(x=>x.id===t.id));
      const r = whole.filter(isRead).length;
      sec("pt:"+t.id, head(t.short||t.title, "reading track", `<span class="thprog">${progressBar({total:whole.length,done:whole.filter(i=>i.status==="done").length,skimmed:whole.filter(i=>i.status==="skimmed").length,reading:whole.filter(i=>i.status==="reading").length},"sm")}<span class="bsub">${r}/${whole.length} done</span></span>`+whyChip(sectionWhy(list))), list, "track:"+t.id);
    }
    const loose = src.filter(i=>!tracksOf(i).length && !progUnitsOf(i).length);
    sec("p:_none", head("Not in a path", "loose sources"), loose, "");
  } else if(filters.group==="recent"){
    const day = 864e5, now = Date.now();
    const age = i => now - (Date.parse(i.addedAt||i.statusChangedAt||"") || 0);
    const buckets = [["r7","This week","added in the last 7 days", i=>age(i)<=7*day],
                     ["r30","This month","8 to 30 days ago", i=>age(i)>7*day && age(i)<=30*day],
                     ["rold","Earlier","more than 30 days ago", i=>age(i)>30*day]];
    for(const [k,name,desc,f] of buckets){
      const list = src.filter(f);
      sec(k, head(name, desc), list, dctx);
    }
  } else {
    for(const n of [1,2,3,4]){
      const list = src.filter(i=>diffOf(i,dctx)===n);
      sec("d"+n, head(DIFF[n], DIFF_HINT[n], diffBadge(n)), list, dctx);
    }
    const un = src.filter(i=>!diffOf(i,dctx));
    sec("d0", head("Not rated yet","Claude rates these when the ledger is next touched"), un, dctx);
  }
  if(secs.length){
    if(filters.group==="theme" || filters.group==="path") secs.sort((a,b)=>aggScore(b[2])-aggScore(a[2]));
    out += secs.map(([k,h,list,c])=>libBand(k, h, list, c, q, secs.length>1 && !filters.q)).join("");
  }
  el.innerHTML = out || `<div class="empty"><h3>Nothing matches</h3>Loosen a filter or clear the search.</div>`;
}

// ================= CONCEPTS =================
let conceptSel = store.get("ll.concept", "");
const openDismissed = new Set();
function conceptList(){
  let ideas = items.filter(i=>i.kind==="idea");
  if(filters.ideaTheme) ideas = ideas.filter(i=>themeIds(i).includes(filters.ideaTheme));
  const po = {high:0,medium:1,low:2}, so = {exploring:0,open:1,tracked:2,parked:3};
  return ideas.sort((a,b)=>(conceptScore(b)-conceptScore(a))
    ||(so[a.status]-so[b.status])||(po[a.priority]-po[b.priority])||String(b.addedAt).localeCompare(String(a.addedAt)));
}
// two sources only: an entry point and one that goes deeper. Claude may pin them with `primary`.
function conceptPick(idea){
  const ctx = "idea:"+idea.id;
  const pool = items.filter(i=>i.ideaId===idea.id && (isLive(i)||i.status==="suggested"));
  const byDiff = [...pool].sort((a,b)=>(diffOf(a,ctx)||9)-(diffOf(b,ctx)||9)||String(a.id).localeCompare(String(b.id)));
  const pinned = (Array.isArray(idea.primary)?idea.primary:[]).map(id=>pool.find(i=>i.id===id)).filter(Boolean);
  const pick = pinned.slice(0,2);
  if(pick.length<1 && byDiff.length) pick.push(byDiff[0]);
  if(pick.length<2){
    const d0 = diffOf(pick[0],ctx)||1;
    const rest = byDiff.filter(i=>!pick.includes(i));
    const deeper = rest.find(i=>(diffOf(i,ctx)||0)>d0) || rest[0];
    if(deeper) pick.push(deeper);
  }
  return {ctx, pick, rest: pool.filter(i=>!pick.includes(i)), pinned: pinned.length>0};
}
function conceptCard(it, ctx, role){
  const links = (it.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("");
  const prov = [it.author?esc(it.author):"", it.year?`<span class="prio">${esc(it.year)}</span>`:"",
    `<span class="chip">${esc(FORMATS[it.format]||it.format||"")}</span>`,
    it.lang?`<span class="chip lang">${esc(it.lang)}</span>`:"",
    diffBadge(diffOf(it,ctx), ctx)].filter(Boolean).join(" ");
  const act = it.status==="suggested"
    ? (RO ? srcShortcuts(it) : `<button class="btn accept sm" data-accept="${esc(it.id)}">Keep it</button><button class="btn ghost" data-dismiss="${esc(it.id)}">Not this one</button>`)
    : `${statusSelect(it)}<span class="chip">in your library</span>`;
  return `<article class="ccard" id="row-${esc(it.id)}">
    <span class="role${role==="Goes deeper"?" deep":""}">${esc(role)}</span>
    <h4>${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)} ↗</a>`:esc(it.title)} ${newChip("concepts", it)}</h4>
    <div class="meta">${prov}</div>
    ${it.note?`<p class="note">${esc(it.note)}</p>`:""}
    ${it.prereq?`<p class="prereq"><b>Prerequisites:</b> ${esc(it.prereq)}</p>`:""}
    ${links?`<div class="links">${links}</div>`:""}
    <div class="foot">${act}</div>
  </article>`;
}
function conceptMoreRow(it, ctx, dim){
  const act = it.status==="suggested"
    ? (RO ? srcShortcuts(it) : `<button class="btn accept sm" data-accept="${esc(it.id)}">Keep</button><button class="btn ghost" data-dismiss="${esc(it.id)}">✕</button>`)
    : it.status==="dismissed" ? (RO ? "" : `<button class="btn ghost" data-restore="${esc(it.id)}">Restore</button>`) : statusSelect(it);
  return `<div class="mrow${dim?" dim":""}" id="row-${esc(it.id)}">
    <div><div class="mt">${it.url?`<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>`:esc(it.title)}</div>
      <div class="mm">${it.author?`<span>${esc(it.author)}</span>`:""}${it.year?`<span>${esc(it.year)}</span>`:""}<span>${esc(FORMATS[it.format]||it.format||"")}</span>${diffOf(it,ctx)?`<span>${esc(DIFF[diffOf(it,ctx)])}</span>`:""}</div></div>
    <div class="actions">${act}</div>
  </div>`;
}
function renderConcepts(){
  const list = conceptList();

  $("#crail").innerHTML = `<div class="crail-h"><span class="lbl">${list.length} concept${list.length===1?"":"s"}</span>
      <select id="f-ctheme" aria-label="Filter concepts by theme" class="btn sm">
        <option value="">All themes</option>${themeOpts.map(t=>`<option value="${esc(t.id)}"${filters.ideaTheme===t.id?" selected":""}>${esc(t.label)}</option>`).join("")}
      </select></div>`
    + (list.length ? list.map(it=>{
        const on = it.id===conceptSel, pend = pendingOf(it.id).length;
        const cls = it.priority==="high" ? "hi" : it.status==="exploring" ? "ex" : it.status==="tracked" ? "tr" : "";
        const acc = items.filter(i=>i.ideaId===it.id && isLive(i));
        const read = acc.filter(isRead).length;
        return `<button class="cpick${on?" on":""}" data-concept="${esc(it.id)}" aria-pressed="${on}">

  if(!list.length){ el.innerHTML = `<div class="empty"><h3>No concept here yet</h3>Send one with +, or tell Claude “add an idea: …”. It comes back with one entry point and one source that goes deeper.</div>`; return; }
  let it = list.find(x=>x.id===conceptSel) || list[0];

  });
  el.innerHTML = `<header class="chead">
      <h2>${esc(it.title)} ${newChip("concepts", it)}</h2>

        ${themeChips(it)}${t?`<button class="chip trk" data-opentrack="${esc(t.id)}">↗ ${esc(t.short||t.title)}</button>`:""}</div>
      ${it.note?`<p class="q">${esc(it.note)}</p>`:""}
      <div class="side">${statusSelect(it)}${removeCtl(it)}${RO?ibxBtn("+ Source for this concept", {type:"Add source", target:it.id}):""}</div>
    </header>
    ${pick.length?`<div class="ctwo">${pick.map((p,k)=>conceptCard(p, ctx, roles[k])).join("")}</div>
      ${pinned?"":`<p class="cask">These two are the lowest-difficulty sources on file; no deliberate pair has been pinned yet — ask in chat.</p>`}`
      : `<div class="empty"><h3>No source yet</h3>Ask Claude in chat — e.g. “two sources to understand ${esc(it.title)}”.</div>`}
    ${others.length?`<details class="cmore"${store.get("ll.cmore",false)?" open":""} id="cmore"><summary>More sources (${others.length})</summary>
      ${others.sort((a,b)=>(diffOf(a,ctx)||9)-(diffOf(b,ctx)||9)).map(i=>conceptMoreRow(i,ctx,false)).join("")}</details>`:""}
    ${dis.length?`<p class="cask"><button class="btn ghost" data-toggledis="${esc(it.id)}">${openDismissed.has(it.id)?"Hide":"Show"} ${dis.length} set aside</button></p>
      ${openDismissed.has(it.id)?`<div class="cmore">${dis.map(i=>conceptMoreRow(i,ctx,true)).join("")}</div>`:""}`:""}
    <p class="cask">Need more? Ask Claude: “more sources on ${esc(it.title)}”, or “pin a better entry point for ${esc(it.title)}”.</p>`;
}

function renderLegend(){

// ================= INBOX — + opens a pre-filled GitHub issue; the 06:30 routine files it =================
const INBOX_REPO = "TancredeA/tancredea.github.io", INBOX_LABEL = "ledger-inbox";
const IBX_TYPES = ["Add source","Change status","New concept","Attach","Other"];
let ibxOpen = false, ibxReq = {}, inboxLog = null;
function targetLabel(id){
  if(!id) return "";
  const it = items.find(i=>i.id===id); if(it) return (it.kind==="idea"?"concept: ":"source: ")+it.title;
  const t = trackOf(id); if(t) return "track: "+(t.short||t.title);
  const p = papers.find(x=>x.id===id); if(p) return "paper: "+p.title;
  const m = /^(\d{4}-\d{2}-\d{2})-(\d+)$/.exec(id);
  if(m){ const d = digests.find(x=>x.id===m[1]), n = d && (d.items||[])[+m[2]]; if(n) return "news of "+fmtDay(m[1],true)+": "+n.title; }
  return "";
}
function openInbox(req){ ibxReq = Object.assign({type:"Add source"}, req||{}); ibxOpen = true; renderInbox(); }
function renderInbox(){
  const el = $("#ibx"), fab = $("#ibx-fab");
  fab.setAttribute("aria-expanded", String(ibxOpen));
  if(!ibxOpen){ el.innerHTML = ""; return; }
  const r = ibxReq, opt = (v,sel,l)=>`<option value="${esc(v)}"${v===sel?" selected":""}>${esc(l??v)}</option>`;
  el.innerHTML = `<div class="drawer-bg" data-ibx="close"></div>
  <aside class="drawer" aria-label="Send to the Ledger">
    <div class="drawer-head"><h3>Send to the Ledger</h3><button class="btn ghost" data-ibx="close" aria-label="Close">✕</button></div>
    <section class="zone"><form class="ibx-form" id="ibx-form">
      <label>Type<select id="ibx-type">${IBX_TYPES.map(t=>opt(t, r.type)).join("")}</select></label>
      <label>Link or title<input id="ibx-link" value="${esc(r.link||"")}" placeholder="https://… or a title"></label>
      <label>Target <span class="ibx-tgt">${esc(targetLabel(r.target)||"a source, concept, track, paper or news id — optional")}</span><input id="ibx-target" value="${esc(r.target||"")}" placeholder="id or title"></label>
      <label>Status<select id="ibx-status">${opt("", r.status||"", "—")}${Object.values(FORM_STATUS).map(v=>opt(v, r.status)).join("")}</select></label>
      <label>Note<textarea id="ibx-note" rows="3" placeholder="why, what's in it, anything the routine should know">${esc(r.note||"")}</textarea></label>
      <div class="asst-btns"><button class="btn primary" type="button" data-ibx="send">Open on GitHub →</button></div>
      <p class="ibx-foot">Opens a pre-filled issue in a new tab: press <b>Submit</b> there. Only issues opened by the repository owner are read. The inbox routine files them every morning and says what it did under “Filed this morning” in the Library.</p>
    </form></section>
  </aside>`;
  setTimeout(()=>{ const f = $(r.target ? "#ibx-note" : "#ibx-link"); if(f) f.focus(); }, 30);
}
function sendInbox(){
  const v = id => ($(id)?.value || "").trim();
  const req = {type:v("#ibx-type"), link:v("#ibx-link"), target:v("#ibx-target"), status:v("#ibx-status"), note:v("#ibx-note")};
  const what = req.link || targetLabel(req.target) || req.target || req.note.slice(0,60) || "request";
  const title = "Ledger: " + req.type + " — " + (what.length>80 ? what.slice(0,78)+"…" : what);
  const tl = targetLabel(req.target);
  const body = ["<!-- Ledger inbox request. Keep the keys; edit the values. Filed at 06:30 Tokyo. -->",
    "Type: "+req.type, "Link or title: "+req.link, "Target: "+req.target+(tl?"  ("+tl+")":""), "Status: "+req.status, "Note:", req.note].join("\n");
  const url = "https://github.com/"+INBOX_REPO+"/issues/new?labels="+encodeURIComponent(INBOX_LABEL)
            + "&title="+encodeURIComponent(title)+"&body="+encodeURIComponent(body);
  window.open(url, "_blank", "noopener");
  ibxOpen = false; renderInbox();
}
function lastRun(){
  const runs = (inboxLog && Array.isArray(inboxLog.runs)) ? inboxLog.runs : [];
  const r = runs[runs.length-1];
  if(!r || !r.at || Date.now() - Date.parse(r.at) > 36*36e5) return null;
  if(!r.error && !(r.entries||[]).length && !r.rejected) return null;      // a quiet morning says nothing
  return r;
}
const runSig = r => "run@"+r.at;
function filedLine(){
  const r = lastRun(); if(!r || store.get("ll.inboxSeen","")===runSig(r)) return "";
  if(r.error) return `<p class="filedline">⚠ The inbox couldn't be read this morning. <button class="linkish ref" data-gofiled="1">details ↗</button></p>`;
  const n = (r.entries||[]).filter(e=>e.outcome!=="left").length, l = (r.entries||[]).length - n;
  return `<p class="filedline">${n} filed this morning${l?` · ${l} left for a session`:""} <button class="linkish ref" data-gofiled="1">see what changed ↗</button></p>`;
}
function renderFiled(){
  const el = $("#inbox-band"); if(!el) return;
  const r = lastRun();
  if(!r || store.get("ll.inboxSeen","")===runSig(r)){ el.innerHTML = ""; return; }
  const mark = {filed:["ok","✓"], updated:["ok","✓"], merged:["ok","↻"], left:["left","⧗"]};
  const link = id => { const it = items.find(i=>i.id===id); if(!it) return `<code>${esc(id)}</code>`;
    return it.kind==="idea" ? `<button class="linkish" data-openidea="${esc(id)}">${esc(it.title)}</button>` : `<button class="linkish" data-jumplib="${esc(id)}">${esc(it.title)}</button>`; };
  const when = new Date(r.at).toLocaleString("en-GB", {weekday:"short", hour:"2-digit", minute:"2-digit"});
  el.innerHTML = `<section class="report filed" aria-label="Filed this morning">
    <div class="rhead"><b>Filed this morning</b><span class="prio">${esc(when)}${r.rejected?` · ${r.rejected} ignored (not from the owner)`:""}</span>
      <button class="btn ghost" data-filedack="${esc(runSig(r))}" aria-label="Dismiss">✕</button></div>
    ${r.error ? `<ul><li><span class="rmark bad">⚠</span>The inbox couldn't be read: ${esc(r.error)}</li></ul>` : `<ul>${(r.entries||[]).map(e=>{ const [c,g] = mark[e.outcome]||["bad","!"];
      return `<li><span class="rmark ${c}">${g}</span><span>${(e.docIds||[]).length?(e.docIds||[]).map(link).join(", ")+" — ":""}${esc(e.explanation||"")}</span></li>`; }).join("")}</ul>`}
  </section>`;
}

  else if(t.dataset.kreset){ const c = kcourses.find(x=>x.id===t.dataset.kreset); if(!c) return; c.done=[]; renderPaths(); renderTally(); await kWrite(c.id,{done:[]}); await syncSource(c); }
  else if(t.closest && t.closest("[data-kstage]")){ document.getElementById("kstage-"+t.closest("[data-kstage]").dataset.kstage)?.scrollIntoView({behavior:"smooth",block:"start"}); }
  else if(t.closest && t.closest("[data-inbox]")){ let req = {}; try{ req = JSON.parse(t.closest("[data-inbox]").dataset.inbox); }catch{}
    openInbox(req); }
  else if(t.id==="ibx-fab"){ ibxOpen ? (ibxOpen=false, renderInbox()) : openInbox({}); }
  else if(t.closest && t.closest("[data-ibx]")){ const a = t.closest("[data-ibx]").dataset.ibx;
    if(a==="close"){ ibxOpen=false; renderInbox(); }
    else if(a==="send"){ sendInbox(); } }
  else if(t.closest && t.closest("[data-auth]")){ const a = t.closest("[data-auth]").dataset.auth;
    if(a==="open"){ authOpen = true; renderAuth(); }
    else if(a==="close"){ authOpen = false; renderAuth(); }
    else if(a==="retry"){ if(db && db.flush) db.flush(); }
    else if(a==="signout"){ window.llAuth.signOut(); location.reload(); } }
  else if(t.dataset.filedack){ store.set("ll.inboxSeen", t.dataset.filedack); render(); }
  else if(t.dataset.gofiled){ libMode = "sources"; store.set("ll.libMode",libMode); view = "library"; store.set("ll.view",view); render(); window.scrollTo({top:0}); }
  else if(t.dataset.ask){ openRemove.add(t.dataset.ask); render(); }
  else if(t.dataset.cancel){ openRemove.delete(t.dataset.cancel); render(); }
  else if(t.dataset.del){
    const id = t.dataset.del; openRemove.delete(id);
    if(db){ try{ await db.doc("items/"+id).delete(); }catch(err){ banner("Couldn't remove it ("+(err.code||"error")+")."); } }
  } else if(t.dataset.theme){
    filters.theme = t.dataset.theme; filters.q = ""; filters.group = "theme"; store.set("ll.filters",filters);
    view = "library"; store.set("ll.view",view); render(); window.scrollTo({top:0});
  } else if(t.dataset.jump){
    let r = document.getElementById("row-"+t.dataset.jump);
    if(!r && (view==="paths" || String(view).startsWith("topic:"))){ collapsedSteps.clear(); hideRead=false; store.set("ll.hideRead",false); store.set("ll.collapsed",[]); render(); r = document.getElementById("row-"+t.dataset.jump); }
    if(r){ r.scrollIntoView({behavior:"smooth",block:"center"}); r.querySelector("select")?.focus({preventScroll:true}); }
  }
});
const bindFilter = (id,key,evt="change") => $(id).addEventListener(evt, e=>{ filters[key]=e.target.value; store.set("ll.filters",filters); renderLibrary(); });
bindFilter("#q","q","input");
$("#f-theme").addEventListener("change", e=>{ filters.theme=e.target.value; store.set("ll.filters",filters); fillSelects(); renderLibrary(); });
bindFilter("#f-status","status"); bindFilter("#f-format","format"); bindFilter("#f-track","track"); bindFilter("#f-diff","diff");
$("#grouper").addEventListener("click", e=>{ const b=e.target.closest("button[data-group]"); if(!b) return; filters.group=b.dataset.group; store.set("ll.filters",filters); renderLibrary(); });
$("#fbtn").addEventListener("click", ()=>{ fpopOpen=!fpopOpen; renderLibrary(); });
$("#lib-hide").addEventListener("change", e=>{ libHide=e.target.checked; store.set("ll.libHide",libHide); renderLibrary(); });
$("#lib-dense").addEventListener("change", e=>{ libDense=e.target.checked; store.set("ll.libDense",libDense); renderLibrary(); });
$("#lib-hide").checked = libHide; $("#lib-dense").checked = libDense;
document.addEventListener("change", e=>{ if(e.target.id==="f-ctheme"){ filters.ideaTheme=e.target.value; store.set("ll.filters",filters); renderConcepts(); } });
document.addEventListener("toggle", e=>{ if(e.target.id==="cmore") store.set("ll.cmore", e.target.open); }, true);
document.addEventListener("keydown", e=>{                      // j / k walk the concept rail
  if(view!=="concepts" || e.metaKey || e.ctrlKey || e.altKey) return;
  const tag = (e.target.tagName||"").toLowerCase();
  if(tag==="input"||tag==="textarea"||tag==="select") return;
  if(e.key!=="j" && e.key!=="k") return;
  const l = conceptList(); if(l.length<2) return;
  const i = Math.max(0, l.findIndex(x=>x.id===conceptSel));
  conceptSel = l[(i + (e.key==="j"?1:l.length-1)) % l.length].id;
  store.set("ll.concept", conceptSel); renderConcepts(); window.scrollTo({top:0});
});
$("#s-track").addEventListener("change", fillSelects);

const slug = s => s.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40) || "item";

$("#form-source").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg = $("#s-msg");
  if(!db){ msg.textContent = "Saving isn't available in this view."; return; }
  const title = $("#s-title").value.trim(); if(!title) return;
  const trackId = $("#s-track").value;
  const doc = {kind:"source", title, author:$("#s-author").value.trim(), url:$("#s-url").value.trim(), format:$("#s-format").value,
    trackId, level:Number($("#s-level").value)||0,
    difficulty: Number($("#s-diff").value) ? Object.fromEntries([["_", Number($("#s-diff").value)], ...(trackId?[["track:"+trackId, Number($("#s-diff").value)]]:[])]) : {}, status:$("#s-status").value, note:$("#s-note").value.trim(), addedAt:new Date().toISOString(), by:"page"};
  try{
    await db.doc("items/src-"+slug(title)+"-"+Date.now().toString(36)).set(doc);
    e.target.reset(); fillSelects(); msg.textContent = "Added “"+title+"”.";
  }catch(err){ msg.textContent = err.code==="quota_exceeded" ? "The ledger is full — remove a few entries first." : "Couldn't add it ("+(err.code||"error")+")."; }
});
$("#form-idea").addEventListener("submit", async e=>{
  e.preventDefault();
  const msg = $("#i-msg");
  if(!db){ msg.textContent = "Saving isn't available in this view."; return; }
  const title = $("#i-title").value.trim(); if(!title) return;
  const doc = {kind:"idea", title, priority:$("#i-prio").value, trackId:$("#i-track").value, themes:$("#i-theme").value?[$("#i-theme").value]:[], note:$("#i-note").value.trim(), status:"open", addedAt:new Date().toISOString(), by:"page"};
  try{
    await db.doc("items/idea-"+slug(title)+"-"+Date.now().toString(36)).set(doc);
    e.target.reset(); $("#i-prio").value="medium"; msg.textContent = "Saved.";
  }catch(err){ msg.textContent = "Couldn't save it ("+(err.code||"error")+")."; }
});

render(); renderOwner();

(async () => {
  fetch("data/inbox-log.json", {cache:"no-cache"}).then(r=>r.ok?r.json():null).then(j=>{ if(j){ inboxLog = j; render(); } }).catch(()=>{});
  db = await window.claude?.use?.("db");
  if(!db){ banner("Your ledger's saved data can't be loaded in this view. Open the published page to see it."); return; }
  RO = !db.writable; $("#add-idea").hidden = RO; renderOwner(); render();
  db.collection("items").onSnapshot(s=>{ loadedCols.add("items"); items = s.docs.map(d=>({id:d.id, ...d.data()})); render(); },
    err=>banner("Live updates stopped ("+err.code+"). Reload the page."));
  db.collection("programmes").onSnapshot(s=>{ loadedCols.add("programmes"); programmes = s.docs.map(d=>({id:d.id, ...d.data()})); render(); },
    err=>banner("Couldn't load the programmes ("+(err.code||"error")+")."));
  db.collection("kaggle").onSnapshot(s=>{ loadedCols.add("kaggle"); kcourses = s.docs.map(d=>({id:d.id, ...d.data()})); render(); },
    err=>banner("Live updates stopped ("+err.code+"). Reload the page."));
  db.collection("digests").onSnapshot(s=>{ loadedCols.add("digests"); digests = s.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>b.id.localeCompare(a.id)); render(); },
    err=>banner("Live updates stopped ("+err.code+"). Reload the page."));
  db.collection("themes").onSnapshot(s=>{ loadedCols.add("themes"); themes = s.docs.map(d=>({id:d.id, ...d.data()})); render(); },
    err=>banner("Live updates stopped ("+err.code+"). Reload the page."));
  db.collection("papers").onSnapshot(s=>{ loadedCols.add("papers"); papers = s.docs.map(d=>({id:d.id, ...d.data()})); render(); },
    err=>{ loadedCols.add("papers"); render(); });
  db.collection("prefs").onSnapshot(s=>{ const d = s.docs.find(x=>x.id==="touch"); if(d) mergeTouch(d.data().seen); render(); },
    err=>{});
  db.collection("tracks").onSnapshot(s=>{ loadedCols.add("tracks"); tracks = s.docs.map(d=>({id:d.id, ...d.data()})); render(); },
    err=>banner("Live updates stopped ("+err.code+"). Reload the page."));
})();
})();
</script>
