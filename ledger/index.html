<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Learning Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --d1:#EEF3FA; --d1-ink:#39618F; --d2:#DCE7F5; --d2-ink:#2A5285; --d3:#5B83B6; --d3-ink:#FFFFFF; --d4:#1E3A63; --d4-ink:#FFFFFF;
  --page:#FAFAFB; --surface:#FFFFFF; --sunk:#F4F5F7; --line:rgba(17,24,39,.09); --hair:rgba(17,24,39,.07);
  --ink:#14181E; --muted:#5C6572; --faint:#949BA5;
  --accent:#1B3A6B; --accent-soft:#EDF2FA; --accent-ink:#FFFFFF;
  --todo:#6C757F; --todo-bg:#F1F2F4;
  --reading:#8A5A10; --reading-bg:#FBF0DC;
  --skimmed:#1C6670; --skimmed-bg:#E4F1F2;
  --done:#256B42; --done-bg:#E6F2EA;
  --warn:#96401F; --warn-bg:#FAE9E1;
  --core:#6E3C92;
  --sh1:0 1px 1px rgba(16,24,40,.03), 0 1px 3px rgba(16,24,40,.04);
  --sh2:0 1px 2px rgba(16,24,40,.04), 0 8px 24px -10px rgba(16,24,40,.13);
  --sh3:0 2px 4px rgba(16,24,40,.05), 0 18px 44px -14px rgba(16,24,40,.22);
  --glass:rgba(255,255,255,.74);
  --radius:14px;
  --serif:"Newsreader",Georgia,"Times New Roman",serif;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --d1:#1D2A3A; --d1-ink:#9DBDE4; --d2:#26405F; --d2-ink:#C3D8F2; --d3:#5B83B6; --d3-ink:#0F1720; --d4:#A9C6EC; --d4-ink:#0F1720;
    --page:#0E1013; --surface:#171A1F; --sunk:#1E2228; --line:rgba(255,255,255,.10); --hair:rgba(255,255,255,.07);
    --ink:#E7E9EC; --muted:#9BA3AD; --faint:#6E7681;
    --accent:#9CBCEC; --accent-soft:#1C2735; --accent-ink:#0F1720;
    --todo:#A3AAB1; --todo-bg:#23272E;
    --reading:#E3B062; --reading-bg:#352916;
    --skimmed:#6CC3CB; --skimmed-bg:#142E31;
    --done:#7CCB97; --done-bg:#17301F;
    --warn:#E99372; --warn-bg:#3A2219;
    --core:#C79BE6;
    --sh1:0 1px 2px rgba(0,0,0,.4); --sh2:0 2px 8px rgba(0,0,0,.45); --sh3:0 12px 36px rgba(0,0,0,.55);
    --glass:rgba(20,23,28,.72);
  }
}
:root[data-theme="dark"]{
  --page:#0E1013; --surface:#171A1F; --sunk:#1E2228; --line:rgba(255,255,255,.10); --hair:rgba(255,255,255,.07);
  --ink:#E7E9EC; --muted:#9BA3AD; --faint:#6E7681; --accent:#9CBCEC; --accent-soft:#1C2735; --accent-ink:#0F1720;
  --glass:rgba(20,23,28,.72);
}
*{box-sizing:border-box}
[hidden]{display:none!important}   /* flex/grid containers must still obey the hidden attribute */
body{background:var(--page);color:var(--ink);font-family:var(--sans);font-size:14.5px;line-height:1.5;margin:0;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(62vw 52vh at 10% -10%, rgba(255,206,150,.20), transparent 68%),
             radial-gradient(58vw 48vh at 94% 2%, rgba(176,204,255,.24), transparent 70%),
             radial-gradient(70vw 60vh at 50% 108%, rgba(214,226,246,.26), transparent 72%)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body::before{opacity:.22}}
.wrap{max-width:1120px;margin:0 auto;padding:0 20px 80px}
a{color:var(--accent)}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance}

/* ---------- sticky chrome ---------- */
.chrome{position:sticky;top:0;z-index:12;margin:0 -20px 18px;padding:14px 20px 0;
  background:var(--glass);backdrop-filter:blur(22px) saturate(1.7);-webkit-backdrop-filter:blur(22px) saturate(1.7);
  border-bottom:1px solid var(--hair)}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 24px}
.brand h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.05;margin:0;letter-spacing:-.015em}
.brand p{margin:4px 0 0;color:var(--muted);max-width:56ch;font-size:13.5px}
.tally{display:flex;gap:6px;flex-wrap:wrap}
.tally .t{display:flex;flex-direction:column;align-items:flex-start;padding:6px 11px;border-radius:10px;background:var(--surface);box-shadow:var(--sh1);min-width:72px}
.tally .t b{font-family:var(--mono);font-size:18px;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.15}
.tally .t span{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint)}
nav.tabs{display:flex;gap:4px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs button{background:none;border:0;padding:9px 13px;cursor:pointer;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;border-radius:8px 8px 0 0}
nav.tabs button:hover{color:var(--ink);background:rgba(17,24,39,.035)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);background:none}
nav.tabs .n{font-family:var(--mono);font-size:11.5px;color:var(--faint);margin-left:5px}

/* ---------- atoms ---------- */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:6px 11px;cursor:pointer;font-weight:500;box-shadow:var(--sh1);transition:box-shadow .15s,border-color .15s}
.btn:hover{border-color:var(--accent);box-shadow:var(--sh2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);padding:4px 8px;box-shadow:none}
.btn.ghost:hover{color:var(--ink);background:var(--sunk);box-shadow:none}
.btn.danger{color:var(--warn);border-color:var(--warn)}
.btn.accept{background:var(--done-bg);color:var(--done);border-color:transparent}
.btn.accept:hover{border-color:var(--done)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.chip{font-size:11px;font-weight:500;padding:1.5px 8px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap;border:0}
.chip.core{background:none;box-shadow:inset 0 0 0 1px var(--core);color:var(--core)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.lang{font-family:var(--mono);text-transform:uppercase}
.chip.theme{background:var(--accent-soft);color:var(--accent);cursor:pointer;font-family:inherit}
.chip.trk{cursor:pointer;font-family:inherit}
.chip.trk:hover{color:var(--accent);background:var(--accent-soft)}
.chip.sugg{background:var(--accent-soft);color:var(--accent)}
.chip.prg{background:var(--done-bg);color:var(--done)}
.chip.idc{background:var(--reading-bg);color:var(--reading)}
.prio{font-family:var(--mono);font-size:11px;color:var(--muted)}
.prio.high{color:var(--warn)}
.tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
.tag{font-family:var(--mono);font-size:11px;color:var(--faint)}
.tag::before{content:"#"}
.linkish{background:none;border:0;padding:0;font-weight:600;color:var(--ink);cursor:pointer;text-align:left;border-bottom:1px solid var(--line)}
.linkish:hover{color:var(--accent);border-bottom-color:var(--accent)}
.linkish.ref{font-weight:500;color:var(--accent);border-bottom-style:dotted}
.linkish.nolink{border-bottom-style:dotted;cursor:default;color:var(--ink)}
.chk{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--muted);cursor:pointer}
mark.mk{background:var(--reading-bg);color:var(--reading);border-radius:3px;padding:0 2px}
.level-head{display:flex;align-items:center;gap:10px;padding:6px 0;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.level-head .rule{flex:1;height:1px;background:var(--hair)}
.empty{padding:34px 20px;text-align:center;color:var(--muted);background:var(--surface);border-radius:var(--radius);box-shadow:var(--sh1)}
.empty h3{font-family:var(--serif);font-weight:600;font-size:19px;color:var(--ink);margin:0 0 4px}
.banner{padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--warn);margin:0 0 16px;font-size:13.5px}
.hint{color:var(--faint);font-size:12.5px;margin-top:30px;border-top:1px solid var(--hair);padding-top:12px}
.hint code{font-family:var(--mono);font-size:12px;background:var(--sunk);padding:1px 5px;border-radius:4px}
.note{color:var(--muted)}
.note.pad{padding:0 16px 12px;margin:0}
.note.pad0{margin:4px 2px;color:var(--muted);font-size:13px}
.card{background:var(--surface);border-radius:var(--radius);box-shadow:var(--sh1)}
.bar{display:flex;width:150px;height:6px;border-radius:999px;overflow:hidden;background:var(--sunk);flex:none}
.bar i{display:block;height:100%}
.bar.sm{width:100%;height:5px;flex:1}
.progress{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--sunk);border-radius:10px;padding:2px;gap:2px}
.seg button{border:0;background:none;padding:5px 11px;border-radius:8px;cursor:pointer;color:var(--muted);font-size:12.5px;font-weight:500;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--sh1)}
.count{font-family:var(--mono);font-size:12px;color:var(--faint)}

/* difficulty */
.rungs{display:inline-flex;align-items:flex-end;gap:2px;height:14px}
.rungs i{width:4px;border-radius:1px;background:var(--line)}
.rungs i:nth-child(1){height:5px}.rungs i:nth-child(2){height:8px}.rungs i:nth-child(3){height:11px}.rungs i:nth-child(4){height:14px}
.rungs i.on{background:var(--accent)}
.rungs.beyond i.on{background:var(--core)}
.diff{display:inline-flex;align-items:center;gap:5px;padding:1px 8px 1px 6px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap;line-height:1.65}
.diff .rungs{height:11px}.diff .rungs i{width:3px;background:currentColor;opacity:.25}
.diff .rungs i:nth-child(1){height:4px}.diff .rungs i:nth-child(2){height:6px}.diff .rungs i:nth-child(3){height:9px}.diff .rungs i:nth-child(4){height:11px}
.diff .rungs i.on{opacity:1}
.diff.d1{background:var(--d1);color:var(--d1-ink)}.diff.d2{background:var(--d2);color:var(--d2-ink)}
.diff.d3{background:var(--d3);color:var(--d3-ink)}.diff.d4{background:var(--d4);color:var(--d4-ink)}
.diff .ctx{font-weight:400;opacity:.85}
.difflist{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:5px;font-size:12px;color:var(--muted)}
.difflist .lbl,.legend .lbl,.wlegend .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--faint)}
.prereq{margin:4px 0 0;font-size:12.5px;color:var(--muted)}
.prereq b{font-weight:600;color:var(--ink)}
.legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin:0 0 16px;font-size:12px;color:var(--muted)}
select.status{appearance:none;-webkit-appearance:none;border:0;border-radius:999px;padding:3px 12px;font-size:12px;font-weight:600;cursor:pointer;text-align:center}
.status[data-s="todo"]{background:var(--todo-bg);color:var(--todo)}
.status[data-s="reading"]{background:var(--reading-bg);color:var(--reading)}
.status[data-s="skimmed"]{background:var(--skimmed-bg);color:var(--skimmed)}
.status[data-s="done"]{background:var(--done-bg);color:var(--done)}
.status[data-s="open"]{background:var(--accent-soft);color:var(--accent)}
.status[data-s="exploring"]{background:var(--reading-bg);color:var(--reading)}
.status[data-s="tracked"]{background:var(--done-bg);color:var(--done)}
.status[data-s="parked"]{background:var(--todo-bg);color:var(--todo)}

/* ---------- today ---------- */
.today-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px 24px;margin-bottom:8px}
.today-head h2{font-family:var(--serif);font-weight:600;font-size:27px;margin:2px 0 4px}
.today-head .desc{color:var(--ink);margin:0 0 6px;max-width:70ch;font-size:15px}
.eyebrow{margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.09em;font-weight:700;color:var(--accent)}
.newscat{margin-top:16px}
.newsgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:10px}
.news{background:var(--surface);border-radius:12px;box-shadow:var(--sh1);padding:13px 15px;display:flex;flex-direction:column;gap:6px}
.news:hover{box-shadow:var(--sh2)}
.news.beyond{box-shadow:inset 0 0 0 1px var(--line)}
.news-head{display:flex;gap:8px;align-items:baseline}
.news h3{font-size:15px;line-height:1.35;margin:0;font-weight:600}
.imp{font-size:9px;letter-spacing:1px;color:var(--accent);flex:none}
.imp.mid{color:var(--reading)}.imp.low{color:var(--faint)}
.news-sum{margin:0;color:var(--muted);font-size:13.5px}
.news-foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-top:auto;padding-top:4px}
.news-src{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12.5px;flex:1 1 100%}
.news-src a{text-decoration:none;color:var(--ink);display:inline-flex;align-items:center;gap:4px}
.news-src a:hover{color:var(--accent)}
.stype{font-size:9.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:0 5px;border-radius:4px;background:var(--sunk);color:var(--muted)}
.stype.primary{background:var(--accent-soft);color:var(--accent)}
.stype.journal{background:var(--done-bg);color:var(--done)}
.stype.x{background:var(--ink);color:var(--surface)}
.hero{margin:10px 0 18px;padding:4px 0 0}
.hero-label{margin:0 0 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.1em;font-weight:700;color:var(--accent)}
.hero-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(272px,1fr));gap:12px}
.hcard{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;background:var(--surface);color:var(--ink);border-radius:var(--radius);padding:16px;box-shadow:var(--sh2)}
.hrank{font-family:var(--serif);font-weight:600;font-size:32px;line-height:1;color:var(--accent);opacity:.3}
.hbody{display:flex;flex-direction:column;gap:6px;min-width:0}
.hcat{margin:0;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--faint)}
.hcard h3{font-family:var(--serif);font-weight:600;font-size:19px;line-height:1.25;margin:0}
.acts{display:inline-flex;gap:2px;margin-left:auto;flex-wrap:wrap}
.readchip{background:var(--done-bg);color:var(--done)}
.related{margin:0;font-size:12.5px;color:var(--muted)}
.score{margin-left:auto;flex:none;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--sunk);border-radius:5px;padding:0 5px;cursor:help;letter-spacing:0;text-transform:none}
.archbtn{font-size:12.5px}
.archbar{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 13px;margin-bottom:10px;border-radius:10px;background:var(--reading-bg);color:var(--reading);font-size:13px;font-weight:600}
.flash{animation:flash 2.4s ease-out}
@keyframes flash{0%,40%{box-shadow:0 0 0 3px var(--reading)}100%{box-shadow:var(--sh1)}}
@media (prefers-reduced-motion:reduce){.flash{animation:none;box-shadow:0 0 0 3px var(--reading)}}
@media (max-width:560px){.newsgrid{grid-template-columns:minmax(0,1fr)}}

/* drawers */
.drawer-bg{position:fixed;inset:0;background:rgba(12,16,24,.22);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100%);z-index:21;background:var(--glass);backdrop-filter:blur(26px) saturate(1.7);-webkit-backdrop-filter:blur(26px) saturate(1.7);
  box-shadow:var(--sh3);display:flex;flex-direction:column;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 16px) 18px calc(env(safe-area-inset-bottom,0px) + 16px)}
.drawer-head{display:flex;justify-content:space-between;align-items:center}
.drawer-head h3{font-family:var(--serif);font-weight:600;font-size:21px;margin:0}
.drawer input,.drawer textarea{padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);width:100%}
.drawer-list{overflow-y:auto;display:flex;flex-direction:column;gap:14px}
.aday-h{display:flex;justify-content:space-between;width:100%;background:none;border:0;padding:0 0 4px;border-bottom:1px solid var(--hair);font-weight:600;cursor:pointer;text-align:left}
.aday ul{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13.5px}
.aday li{display:flex;gap:8px;align-items:baseline;justify-content:space-between}

/* ---------- paths (programmes + reading tracks) ---------- */
.pathbar{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.pathgroup{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.pathgroup::-webkit-scrollbar{display:none}
.pathlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--faint);display:flex;align-items:center;gap:8px}
.pathlbl .rule{flex:1;height:1px;background:var(--hair)}
.pathtab{flex:0 0 212px;text-align:left;background:var(--surface);border:0;border-radius:12px;padding:10px 12px;cursor:pointer;
  display:flex;flex-direction:column;gap:6px;box-shadow:var(--sh1);transition:box-shadow .15s,transform .15s}
.pathtab:hover{box-shadow:var(--sh2)}
.pathtab b{font-family:var(--serif);font-size:15px;font-weight:600;line-height:1.2;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pathtab .bar{flex:none;height:6px;width:100%}
.pathtab .pmeta{font-size:11.5px;color:var(--faint);font-family:var(--mono)}
.pathtab .pnext{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pathtab .pnext.done{color:var(--done)}
.pathtab.on{box-shadow:var(--sh2),inset 0 0 0 1.5px var(--accent)}
.pathtab.on b{color:var(--accent)}
.pathtab.pseudo{box-shadow:var(--sh1),inset 0 0 0 1px var(--line);background:var(--sunk)}
.track{margin:0}
.tmain{min-width:0}
.track-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:10px 20px;margin-bottom:10px}
.track-head h2{font-family:var(--serif);font-weight:600;font-size:25px;margin:0}
.track-head .desc{color:var(--muted);margin:4px 0 0;max-width:70ch}
.minpath{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 4px;font-size:12.5px;color:var(--muted)}
.minpath .step{font-family:var(--mono);padding:2px 8px;border-radius:7px;background:var(--surface);box-shadow:var(--sh1);color:var(--ink);cursor:pointer;border:0}
.minpath .step.done{background:var(--done-bg);color:var(--done);box-shadow:none}
.minpath .arrow{color:var(--faint)}
.nextup{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:11px 13px;border-radius:12px;background:var(--surface);box-shadow:var(--sh1);margin:4px 0 10px}
.nextup.done{color:var(--done)}
.nextup .lbl,.stepfoot{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--faint)}
.tbar{position:sticky;top:112px;z-index:3;background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);
  display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:8px 10px;border-radius:12px;box-shadow:var(--sh1);margin-bottom:6px}
.snavs{display:flex;gap:6px;overflow-x:auto;min-width:0;max-width:100%;scrollbar-width:none}
.snavs::-webkit-scrollbar{display:none}
.snav{display:flex;flex-direction:column;align-items:flex-start;flex:none;border:0;background:var(--sunk);border-radius:9px;padding:4px 10px;cursor:pointer;font-size:12px;max-width:210px}
.snav b{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:190px}
.snav span{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
.snav:hover{background:var(--accent-soft);color:var(--accent)}
.snav.complete{background:var(--done-bg)}
.snav.complete span{color:var(--done)}
.tctl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stepsec{scroll-margin-top:170px}
.stepbtn{width:100%;background:none;border:0;cursor:pointer;text-align:left;margin-top:12px}
.stepbtn:hover span{color:var(--ink)}
.caret{width:12px;color:var(--faint)}
.stepfoot{margin:6px 2px 0}
.list{background:var(--surface);border-radius:var(--radius);overflow:hidden;box-shadow:var(--sh1)}
.row{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:4px 12px;padding:12px 15px;border-top:1px solid var(--hair);align-items:start}
.row:first-child{border-top:0}
.row:hover{background:linear-gradient(90deg,var(--sunk),transparent 60%)}
.row .num{font-family:var(--mono);font-size:12px;color:var(--faint);padding-top:3px;font-variant-numeric:tabular-nums}
.row .main{min-width:0}
.row .lead{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-bottom:4px}
.row .title{font-weight:600;line-height:1.35;overflow-wrap:anywhere}
.row .title a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.row .title a:hover{border-bottom-color:var(--accent);color:var(--accent)}
.row .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;color:var(--muted);font-size:13px}
.row.is-done .title a,.row.is-done .title span.tt{color:var(--muted)}
.row .note{margin:6px 0 0;font-size:13.5px;max-width:74ch}
.row .links{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:13px}
.row .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.row .actions{display:flex;gap:4px;margin-top:8px;flex-wrap:wrap}
.own{display:flex;flex-wrap:wrap;gap:4px 6px;margin-top:6px}

/* programme cards */
.kgrid{display:flex;flex-direction:column;gap:10px}
.kstage{margin-top:18px;scroll-margin-top:170px}
.kcard{background:var(--surface);border-radius:var(--radius);padding:13px 15px;box-shadow:var(--sh1)}
.kcard:hover{box-shadow:var(--sh2)}
.kcard.k-done{background:linear-gradient(var(--done-bg),var(--done-bg));box-shadow:none}
.kcard.k-progress{box-shadow:var(--sh1),inset 3px 0 0 var(--reading)}
.kcard.k-here{box-shadow:var(--sh2),inset 3px 0 0 var(--accent)}
.kmain{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px}
.korder{font-family:var(--mono);font-size:13px;color:var(--faint);padding-top:3px}
.kbody{display:flex;flex-direction:column;gap:7px;min-width:0}
.ktop{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px}
.ktop h3{font-family:var(--serif);font-weight:600;font-size:18px;margin:0}
.ktop h3 a{color:var(--ink);text-decoration:none}
.ktop h3 a:hover{color:var(--accent)}
.kst{font-size:11px;font-weight:600;padding:1.5px 8px;border-radius:999px;background:var(--todo-bg);color:var(--todo)}
.kst.progress{background:var(--reading-bg);color:var(--reading)}
.kst.done{background:var(--surface);color:var(--done)}
.kcard .note{margin:0;font-size:13.5px;max-width:78ch}
.kprog{display:flex;align-items:center;gap:8px;max-width:380px;flex-wrap:wrap}
.kpips{display:flex;flex-wrap:wrap;gap:4px}
.kpip{width:27px;height:23px;border-radius:7px;border:0;background:var(--sunk);font-family:var(--mono);font-size:11px;cursor:pointer;color:var(--muted)}
.kpip:hover{background:var(--accent-soft);color:var(--accent)}
.kpip.on{background:var(--done);color:#fff}
.kpip.nextk{box-shadow:inset 0 0 0 2px var(--reading);color:var(--reading);font-weight:600}
.kfoot{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}
.klessons{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.klessons li{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px}
.klessons li.on{color:var(--muted);text-decoration:line-through}
.klessons label{cursor:pointer;display:inline-flex;gap:6px;align-items:baseline;flex:1;min-width:0}
.kextras{list-style:none;margin:4px 0;padding-left:14px;display:flex;flex-direction:column;gap:3px;flex-basis:100%;border-left:1px solid var(--hair)}
.kextras li{font-size:12.5px;color:var(--muted)}
.kextras li.on{text-decoration:line-through}
.xkind{font-size:10px;letter-spacing:.04em;text-transform:uppercase;border-radius:999px;padding:1px 6px;background:var(--sunk);color:var(--muted)}
.xkind.problem{background:var(--warn-bg);color:var(--warn)}
.kjump{font-size:12px;color:var(--muted);text-decoration:none}
.kjump:hover{color:var(--accent)}
.kmark{border:0;background:none;cursor:pointer;font-size:12px;opacity:.26;padding:0 2px;line-height:1}
.kmark:hover{opacity:.9}
.kmark.on{opacity:1}
.lw{font-family:var(--mono);font-size:11px;color:var(--faint);white-space:nowrap}
.lw.pg{color:var(--muted)}
.bmark{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;border-radius:12px;padding:9px 13px;margin:0 0 10px;background:var(--accent-soft)}
.bmark .lbl{font-size:10.5px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.bmark.empty-bm{background:var(--sunk)}
.bmark .note{margin:0;font-size:13px}
.bmchip{background:var(--accent-soft);color:var(--accent)}
.wlegend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 0;font-size:12.5px;color:var(--muted)}
.ksum .t{min-width:68px}
.ksum .t b.wnum{font-size:15px;line-height:1.5}
.tp-n{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.tp-n.wdim{color:var(--faint);cursor:help}

/* ---------- library ---------- */
.libbar{position:sticky;top:112px;z-index:4;display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:9px 11px;margin-bottom:10px;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.6);-webkit-backdrop-filter:blur(18px) saturate(1.6);border-radius:12px;box-shadow:var(--sh1)}
.libbar input[type=search]{flex:1 1 200px;min-width:0;padding:7px 12px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.libbar .seg{flex:none}
.fpop[hidden]{display:none}
.fpop{display:flex;flex-wrap:wrap;gap:8px;padding:11px 13px;margin:-4px 0 12px;background:var(--surface);border-radius:12px;box-shadow:var(--sh2)}
.fpop select{padding:6px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);flex:1 1 150px;min-width:0}
.fchips{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 12px;align-items:center}
.fchip{display:inline-flex;align-items:center;gap:6px;font-size:12px;padding:3px 6px 3px 10px;border-radius:999px;background:var(--accent-soft);color:var(--accent);border:0;cursor:pointer;font-weight:500}
.fchip b{font-weight:700}
.fchip span{opacity:.6;font-size:13px}
.fchip:hover span{opacity:1}
.band{margin-bottom:14px}
.bandhead{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;cursor:pointer;text-align:left;padding:6px 2px}
.bandhead .bname{font-family:var(--serif);font-size:18px;font-weight:600;color:var(--ink)}
.bandhead .bsub{font-family:var(--mono);font-size:11.5px;color:var(--faint);white-space:nowrap}
.bandhead .bdesc{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:46ch}
.thprog{display:flex;align-items:center;gap:8px;flex:none}
.thprog .bar{width:96px;flex:none}
.bandhead .rule{flex:1;height:1px;background:var(--hair)}
.bandhead .pin{width:8px;height:8px;border-radius:50%;flex:none}
.bandhead p.bdesc{margin:2px 0 0;font-size:12.5px;color:var(--muted);font-family:var(--sans)}
.bandwrap{display:flex;flex-direction:column;gap:2px}
.bmore{margin:6px auto 0;display:block}
.why{font-size:11px;color:var(--faint);white-space:nowrap}
.why::before{content:"· "}
.cpick .why{display:block;white-space:normal}
.cpick .why::before{content:""}
.bandhead .why{font-family:var(--sans)}
.modeseg{margin-bottom:12px}
.modeseg button{padding:6px 14px;font-size:13px}
.modeseg b{font-family:var(--mono);font-size:11px;font-weight:500;color:var(--faint);margin-left:4px}
.modeseg button[aria-pressed="true"] b{color:var(--accent)}
.bandveil{position:relative;max-height:0;overflow:hidden}
.srow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;background:var(--surface);border-radius:12px;padding:12px 14px;box-shadow:var(--sh1);align-items:start}
.srow:hover{box-shadow:var(--sh2)}
.srow .st{min-width:0}
.srow .title{font-weight:600;line-height:1.35;overflow-wrap:anywhere;font-size:15px}
.srow .title a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.srow .title a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.srow .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;margin-top:4px;color:var(--muted);font-size:12.5px}
.srow .note{margin:6px 0 0;font-size:13.5px;max-width:76ch}
.srow .links{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:13px}
.srow .side{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.srow .actions{display:flex;gap:4px;flex-wrap:wrap}
.srow.w-hot{box-shadow:var(--sh2),inset 3px 0 0 var(--reading);padding:14px 16px}
.srow.w-hot .title{font-size:16.5px}
.srow.w-warm .note{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.srow.w-cool{background:transparent;box-shadow:none;padding:5px 14px;grid-template-columns:minmax(0,1fr) auto;align-items:center;border-radius:8px}
.srow.w-cool:hover{background:var(--surface);box-shadow:var(--sh1)}
.srow.w-cool .title{font-size:13.5px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.w-cool .title a{color:var(--muted);border:0}
.srow.w-cool .note,.srow.w-cool .links,.srow.w-cool .prereq,.srow.w-cool .difflist,.srow.w-cool .tags{display:none}
.srow.w-cool .meta{margin-top:0;font-size:11.5px}
.srow.w-cool .own{margin-top:0}
.srow.w-cool .own .chip{font-size:10px}
.dense .srow{padding:8px 13px}
.dense .srow .note,.dense .srow .links,.dense .srow .tags,.dense .srow .prereq{display:none}
.dense .srow .title{font-size:14px}

/* ---------- concepts ---------- */
.cgrid{display:grid;grid-template-columns:268px minmax(0,1fr);gap:22px;align-items:start}
.crail{display:flex;flex-direction:column;gap:6px;position:sticky;top:116px;max-height:calc(100vh - 140px);overflow-y:auto;padding:2px;scrollbar-width:thin}
.cpick{display:flex;flex-direction:column;gap:3px;text-align:left;background:none;border:0;border-radius:10px;padding:8px 11px;cursor:pointer}
.cpick:hover{background:var(--surface);box-shadow:var(--sh1)}
.cpick.on{background:var(--surface);box-shadow:var(--sh2),inset 2.5px 0 0 var(--accent)}
.cpick .ct{font-weight:600;font-size:13.5px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cpick.on .ct{color:var(--accent)}
.cpick .cm{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--faint);font-family:var(--mono)}
.cpick .pin{width:6px;height:6px;border-radius:50%;background:var(--line);flex:none}
.cpick .pin.hi{background:var(--warn)}
.cpick .pin.ex{background:var(--reading)}
.cpick .pin.tr{background:var(--done)}
.crail-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:2px 6px 6px}
.crail-h .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--faint)}
.cmain{min-width:0}
.chead{margin-bottom:16px}
.chead h2{font-family:var(--serif);font-weight:600;font-size:26px;margin:0 0 6px;line-height:1.2}
.chead .meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:8px}
.chead .q{color:var(--muted);font-size:14px;max-width:72ch;margin:0}
.chead .side{display:flex;align-items:center;gap:6px;margin-top:10px;flex-wrap:wrap}
.ctwo{display:grid;grid-template-columns:repeat(auto-fit,minmax(286px,1fr));gap:12px}
.ccard{background:var(--surface);border-radius:var(--radius);padding:15px 16px;box-shadow:var(--sh2);display:flex;flex-direction:column;gap:8px}
.ccard .role{font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent)}
.ccard .role.deep{color:var(--core)}
.ccard h4{font-family:var(--serif);font-size:17.5px;font-weight:600;margin:0;line-height:1.3}
.ccard h4 a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.ccard h4 a:hover{color:var(--accent);border-bottom-color:var(--accent)}
.ccard .meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;color:var(--muted);font-size:12.5px}
.ccard .note{margin:0;font-size:13.5px}
.ccard .links{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px}
.ccard .foot{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:auto;padding-top:4px}
.cmore{margin-top:16px;background:var(--surface);border-radius:12px;box-shadow:var(--sh1);overflow:hidden}
.cmore > summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--muted);list-style:none;display:flex;align-items:center;gap:8px}
.cmore > summary::-webkit-details-marker{display:none}
.cmore > summary:hover{color:var(--ink)}
.cmore[open] > summary{border-bottom:1px solid var(--hair)}
.cmore .mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:9px 14px;border-top:1px solid var(--hair);align-items:center}
.cmore .mrow:first-of-type{border-top:0}
.cmore .mrow .mt{font-size:13.5px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.cmore .mrow .mt a{color:var(--ink);text-decoration:none}
.cmore .mrow .mt a:hover{color:var(--accent)}
.cmore .mrow .mm{display:flex;flex-wrap:wrap;gap:4px 8px;font-size:11.5px;color:var(--faint);margin-top:2px}
.cmore .mrow.dim{opacity:.55}
.cask{margin-top:14px;font-size:13px;color:var(--muted)}

/* ---------- assistant ---------- */
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:15;border:0;border-radius:999px;padding:11px 18px;
  background:var(--accent);color:var(--accent-ink);font-weight:600;box-shadow:var(--sh3);cursor:pointer;display:flex;gap:8px;align-items:center;overflow:visible}
.fab-n{background:var(--reading);color:#fff;border-radius:999px;font-size:11px;padding:0 7px;line-height:18px}
.asst textarea{resize:vertical}
.asst-btns{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.asst-status{color:var(--accent);font-weight:600;margin:0}
.plan{border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:8px;background:var(--surface);box-shadow:var(--sh2)}
.plan p{margin:0}
.plan .clar{color:var(--reading);font-weight:600}
.plan ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.plan label{display:flex;gap:8px;align-items:baseline;cursor:pointer}
.asst-log p{margin:0 0 4px;font-size:13px;color:var(--muted)}
.qsec{display:flex;flex-direction:column;gap:6px}
.qlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:13px}
.qlist li{display:flex;justify-content:space-between;gap:8px;align-items:baseline;border-bottom:1px solid var(--hair);padding-bottom:4px}
.qlist.done li{color:var(--muted)}
.drawer.asst{overflow-y:auto}
.tdot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:5px;vertical-align:super;box-shadow:0 0 0 2px var(--surface)}
.tdot.pend{background:var(--reading)}
.fabdot{position:absolute;top:2px;right:4px;margin:0;box-shadow:0 0 0 2px var(--accent)}
.newchip{background:var(--warn-bg);color:var(--warn);font-weight:600;margin-left:4px;vertical-align:middle}
.newline{margin:0 0 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--warn)}

/* ---------- forms ---------- */
details.add{background:var(--surface);border-radius:12px;margin-bottom:16px;box-shadow:var(--sh1)}
details.add summary{cursor:pointer;padding:10px 14px;font-weight:600;color:var(--accent);list-style:none}
details.add summary::-webkit-details-marker{display:none}
details.add[open] summary{border-bottom:1px solid var(--hair)}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 14px;padding:14px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);font-weight:700}
.field.wide{grid-column:1/-1}
.field select,.field input,.field textarea{padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)}
.field textarea{min-height:64px;resize:vertical}
.formfoot{grid-column:1/-1;display:flex;gap:10px;align-items:center}
.formfoot .msg{color:var(--muted);font-size:13px}

/* ---------- responsive ---------- */
@media (max-width:980px){
  .cgrid{grid-template-columns:minmax(0,1fr)}
  .crail{position:static;flex-direction:row;overflow-x:auto;max-height:none;padding-bottom:6px}
  .cpick{flex:0 0 190px}
  .crail-h{display:none}
}
@media (max-width:640px){
  .wrap{padding:0 14px 80px}
  .chrome{margin:0 -14px 16px;padding:12px 14px 0}
  .brand h1{font-size:25px}
  .brand p{display:none}
  .tally .t{min-width:62px;padding:5px 9px}
  .tally .t b{font-size:16px}
  .row{grid-template-columns:24px minmax(0,1fr)}
  .row .side{grid-column:2;flex-direction:row;align-items:center;justify-content:flex-start}
  .srow,.srow.w-cool{grid-template-columns:minmax(0,1fr)}
  .srow .side{flex-direction:row;align-items:center;justify-content:flex-start;margin-top:8px}
  .srow.w-cool .side{margin-top:4px}
  .srow.w-cool .title{white-space:normal}
  .bar{width:104px}
  .legend span:not(.lbl):not(.diff):not(.rungs):not(.rungs i){display:none}
  .libbar,.tbar{top:104px}
  .crail{top:auto}
  .ctwo{grid-template-columns:minmax(0,1fr)}
  .pathtab{flex:0 0 176px}
}
/* ---------- today: index, ranked list, briefs ---------- */
.dayindex{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 16px}
.dix{display:inline-flex;align-items:center;gap:6px;max-width:260px;border:0;cursor:pointer;border-radius:999px;
  padding:3px 11px 3px 7px;font-size:12px;background:var(--sunk);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dix b{font-family:var(--mono);font-size:10.5px;color:var(--faint);font-weight:500}
.dix:hover{background:var(--accent-soft);color:var(--accent)}
.dix.w-hot{background:var(--surface);color:var(--ink);box-shadow:var(--sh1),inset 2px 0 0 var(--accent);font-weight:600}
.dix.has{opacity:.55}
.nlist{display:flex;flex-direction:column;gap:2px}
.nband{margin-bottom:12px}
.nrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;background:var(--surface);border-radius:12px;
  padding:12px 14px;box-shadow:var(--sh1);align-items:start}
.nrow:hover{box-shadow:var(--sh2)}
.nmain{min-width:0}
.nhead{display:flex;gap:8px;align-items:baseline}
.nrow h3{margin:0;font-size:15.5px;line-height:1.35;font-weight:600}
.nmeta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;margin-top:5px}
.ncat,.nday{cursor:pointer;font-family:inherit}
.ncat:hover,.nday:hover{background:var(--accent-soft);color:var(--accent)}
.nrow .news-sum{margin:7px 0 0}
.nrow .news-src{margin-top:7px}
.nact{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:4px}
.nrow.w-hot{box-shadow:var(--sh2),inset 3px 0 0 var(--accent);padding:14px 16px}
.nrow.w-hot h3{font-size:17px}

<script>
// v28 data adapter: the artifact's document store, served from data/*.json in this repository.
// Signed out (everyone): read-only, files fetched from the site; every write is refused except prefs/touch,
// which stays on this device (localStorage "ll.touch").
// Signed in (the owner, with a fine-grained GitHub token stored on this device under "ll.ghToken"):
// files are read fresh from the GitHub API and every write becomes a commit on main. Writes are applied
// on screen at once, batched for a few seconds, then committed in one commit; if a routine committed in
// between, the batch is replayed on top of the new version. GitHub itself refuses anyone without push rights.
(() => {
  const OWNER = "TancredeA", REPO = "TancredeA/tancredea.github.io", BRANCH = "main", DIR = "ledger/data/";
  const API = "https://api.github.com/repos/" + REPO;
  const FILES = {digests: "digests/all.json"};
  const fileOf = name => FILES[name] || (name + ".json");
  const ls = {get(k){ try { return localStorage.getItem(k); } catch { return null; } },
              set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} }};
  const token = ls.get("ll.ghToken");
  const gh = (url, opt = {}) => fetch(url.startsWith("http") ? url : API + url, Object.assign({cache: "no-store"}, opt, {
    headers: Object.assign({Authorization: "Bearer " + token, "X-GitHub-Api-Version": "2022-11-28", Accept: "application/vnd.github+json"}, opt.headers || {})}));
  const ghJson = async (url, opt) => { const r = await gh(url, opt); if (!r.ok) throw Object.assign(new Error("GitHub " + r.status + " on " + url), {status: r.status}); return r.json(); };
  const raw = async (path, ref) => { const r = await gh("/contents/" + DIR + path + "?ref=" + encodeURIComponent(ref || BRANCH), {headers: {Accept: "application/vnd.github.raw+json"}});
    if (r.status === 404) return {}; if (!r.ok) throw Object.assign(new Error("GitHub " + r.status), {status: r.status}); return r.json(); };
  const site = name => fetch("data/" + fileOf(name), {cache: "no-cache"}).then(r => r.ok ? r.json() : {}).catch(() => ({}));
  const emitSync = detail => window.dispatchEvent(new CustomEvent("ll-sync", {detail}));
  const localTouch = () => { try { return JSON.parse(ls.get("ll.touch") || "null"); } catch { return null; } };
  const refuse = path => Promise.reject(Object.assign(new Error("Read-only page: " + path + " can't be written here."), {code: "read_only"}));

  let writable = false, login = "";
  const auth = !token ? Promise.resolve() : Promise.race([
    (async () => {
      const u = await ghJson("https://api.github.com/user");
      if (u.login !== OWNER) throw new Error("this token belongs to " + u.login + ", not " + OWNER);
      await ghJson("");                                   // the token can see the repository
      writable = true; login = u.login;
    })(),
    new Promise((_, no) => setTimeout(() => no(new Error("GitHub did not answer")), 8000)),
  ]).catch(e => { emitSync({state: "auth-error", message: String(e.message || e)}); });

  const state = {}, listeners = {};
  const docsOf = name => Object.entries(state[name] || {}).map(([id, d]) => ({id, data: () => d}));
  const emit = name => { for (const f of listeners[name] || []) f({docs: docsOf(name)}); };
  async function load(name){
    if (name === "prefs") return (t => t ? {touch: t} : {})(localTouch());
    if (writable && name !== "digests") { try { return await raw(fileOf(name)); } catch (e) { /* fall back to the site */ } }
    return site(name);
  }

  // ---------- writes (owner only): local first, then one commit per batch ----------
  const pending = []; let timer = null, flushing = false, again = false;
  const clone = o => JSON.parse(JSON.stringify(o));
  function applyOp(obj, op){
    if (op.kind === "set") obj[op.id] = clone(op.data);
    else if (op.kind === "update") obj[op.id] = Object.assign(obj[op.id] || {}, clone(op.data));
    else delete obj[op.id];
  }
  const serialize = obj => JSON.stringify(obj, null, 1) + "\n";      // same layout as the Python tools
  function queue(op){
    if (!state[op.col]) state[op.col] = {};
    if (op.kind === "update" && !state[op.col][op.id]) return Promise.reject(Object.assign(new Error("No document " + op.col + "/" + op.id), {code: "not_found"}));
    applyOp(state[op.col], op);
    pending.push(op);
    queueMicrotask(() => emit(op.col));
    emitSync({state: "pending", count: pending.length});
    clearTimeout(timer); timer = setTimeout(flush, 2500);
    return Promise.resolve();
  }
  function describe(ops){
    const names = [...new Set(ops.map(o => {
      const d = o.data || {};
      if (o.kind === "delete") return "remove " + o.id;
      if (d.status) return o.id + " → " + d.status;
      if (d.done) return o.id + " progress";
      if ("bookmark" in d) return o.id + " bookmark";
      return (o.kind === "set" ? "add " : "edit ") + o.id;
    }))];
    return "Ledger (page): " + (names.length > 3 ? names.slice(0, 3).join(", ") + " and " + (names.length - 3) + " more" : names.join(", "));
  }
  async function flush(){
    clearTimeout(timer); timer = null;
    if (!pending.length) return;
    if (flushing) { again = true; return; }
    flushing = true;
    const ops = pending.splice(0);
    emitSync({state: "saving", count: ops.length});
    let lastErr = null;
    for (let attempt = 0; attempt < 4; attempt++) {
      try {
        const ref = await ghJson("/git/ref/heads/" + BRANCH);
        const head = ref.object.sha;
        const commit = await ghJson("/git/commits/" + head);
        const cols = [...new Set(ops.map(o => o.col))];
        const tree = [];
        for (const col of cols) {
          const obj = await raw(fileOf(col), head);
          ops.filter(o => o.col === col).forEach(o => { if (o.kind !== "update" || obj[o.id]) applyOp(obj, o); });
          tree.push({path: DIR + fileOf(col), mode: "100644", type: "blob", content: serialize(obj)});
          state[col] = obj;                               // what is on GitHub now, routines' changes included
        }
        const t = await ghJson("/git/trees", {method: "POST", body: JSON.stringify({base_tree: commit.tree.sha, tree})});
        const c = await ghJson("/git/commits", {method: "POST", body: JSON.stringify({message: describe(ops), tree: t.sha, parents: [head]})});
        const r = await gh("/git/refs/heads/" + BRANCH, {method: "PATCH", body: JSON.stringify({sha: c.sha, force: false})});
        if (r.status === 422 || r.status === 409) { lastErr = new Error("main moved; retrying"); continue; }   // someone committed meanwhile
        if (!r.ok) throw Object.assign(new Error("GitHub " + r.status + " when updating main"), {status: r.status});
        for (const p of pending) applyOp(state[p.col] || (state[p.col] = {}), p);   // edits made while saving stay on screen
        cols.forEach(emit);
        lastErr = null;
        emitSync({state: "saved", sha: c.sha.slice(0, 7), at: new Date().toISOString(), count: pending.length});
        break;
      } catch (e) {
        lastErr = e;
        if (e.status === 401 || e.status === 403 || e.status === 404) break;   // retrying will not help
        await new Promise(res => setTimeout(res, 800 * (attempt + 1)));
      }
    }
    if (lastErr) {
      pending.unshift(...ops);                            // keep them; the next change or a click on the status retries
      const why = lastErr.status === 401 ? "the token was refused (expired or revoked?)"
                : lastErr.status === 403 || lastErr.status === 404 ? "the token can't write to the repository (needs Contents: read and write)"
                : String(lastErr.message || lastErr);
      emitSync({state: "error", message: why, count: pending.length});
    }
    flushing = false;
    if (again) { again = false; flush(); }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && pending.length) flush(); });
  window.addEventListener("beforeunload", e => { if (pending.length || flushing) { flush(); e.preventDefault(); e.returnValue = ""; } });

  const staticDb = {
    get writable(){ return writable; }, get login(){ return login; },
    flush,
    collection(name){
      return { onSnapshot(next, error){
        (listeners[name] = listeners[name] || []).push(next);
        load(name).then(obj => { state[name] = obj || {}; next({docs: docsOf(name)}); }).catch(e => { if (error) error(e); });
        return () => { listeners[name] = (listeners[name] || []).filter(f => f !== next); };
      } };
    },
    doc(path){
      const [col, id] = path.split("/");
      const local = col === "prefs" && id === "touch";
      return {
        set(obj){
          if (local) { ls.set("ll.touch", JSON.stringify(obj)); return Promise.resolve(); }
          return writable ? queue({col, id, kind: "set", data: obj}) : refuse(path);
        },
        update(patch){ return writable && !local ? queue({col, id, kind: "update", data: patch}) : refuse(path); },
        delete(){ return writable && !local ? queue({col, id, kind: "delete"}) : refuse(path); },
      };
    },
  };
  window.claude = { use: async name => { if (name !== "db") return undefined; await auth; return staticDb; } };
  window.llAuth = {
    owner: OWNER, repo: REPO, signedIn: () => !!token,
    async check(t){
      const h = {Authorization: "Bearer " + t, Accept: "application/vnd.github+json"};
      const u = await fetch("https://api.github.com/user", {headers: h, cache: "no-store"});
      if (u.status === 401) throw new Error("GitHub refused this token.");
      if (!u.ok) throw new Error("GitHub answered " + u.status + ".");
      const who = (await u.json()).login;
      if (who !== OWNER) throw new Error("This token belongs to " + who + ", not " + OWNER + ".");
      const r = await fetch(API, {headers: h, cache: "no-store"});
      if (!r.ok) throw new Error("This token can't see " + REPO + ": give it access to that repository.");
      return who;
    },
    signIn(t){ ls.set("ll.ghToken", t); },
    signOut(){ ls.set("ll.ghToken", null); },
  };
})();

<script>
(() => {
let RO = true;                                     // v28: read-only for everyone; the owner signed in with GitHub can edit
const STATUS = {todo:"To do", reading:"In progress", skimmed:"Quick pass", done:"Done"};
const STATUS_ORDER = ["reading","todo","skimmed","done"];
const IDEA_STATUS = {open:"Open", exploring:"Exploring", tracked:"Has a track", parked:"Parked"};
const FORMATS = {article:"Article", video:"Video", lecture:"Lecture series", course:"Course", book:"Book", paper:"Paper", notes:"Notes / docs", code:"Code / repo", other:"Other"};
const DIFF = {1:"Beginner",2:"Intermediate",3:"Advanced",4:"Expert"};
const DIFF_HINT = {1:"no prerequisites",2:"needs the basics of the subject",3:"needs solid maths / ML background",4:"research-level, dense"};
const LEVELS = {1:"Intuitions",2:"Practice",3:"Deep dive",4:"Research & news",5:"Going further"};
const isLive = i => i.kind!=="idea" && i.status!=="suggested" && i.status!=="dismissed";
const pendingOf = id => items.filter(i=>i.ideaId===id && i.status==="suggested");
const ideaOf = id => items.find(i=>i.id===id && i.kind==="idea");;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const store = {get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch{return d}}, set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

const VIEW_MAP = {kaggle:"paths", learning:"paths", tracks:"paths", all:"library", themes:"library", ideas:"concepts", archive:"library"};
let db = null, items = [], tracks = [], themes = [], view = (v=>VIEW_MAP[v]||v)(store.get("ll.view","today")), digests = [], digestSel = "", kcourses = [], programmes = [];
const filters = Object.assign({diff:"",ideaTheme:"",theme:"",q:"",status:"",format:"",track:"",level:"",group:"pickup"}, store.get("ll.filters",{}));
if(!["pickup","status","theme","path","recent","diff"].includes(filters.group)) filters.group = "pickup";
const openRemove = new Set();

function themeOf(id){return themes.find(t => t.id === id)}
function themeIds(it){const own = it.themes || (it.theme ? [it.theme] : []); return own.length ? own : (tracksOf(it)[0]?.themes || [])}
function themeChips(it){return themeIds(it).map(id=>`<button class="chip theme" data-theme="${esc(id)}" title="See this theme">${esc(themeOf(id)?.label||id)}</button>`).join("")}
function trackOf(id){return tracks.find(t => t.id === id)}
function levelLabel(t, n){const l = t?.levels?.find(x => x.n === n); return l ? l.label : (n ? "L"+n+" · "+(LEVELS[n]||"") : "Unleveled")}
function rungs(n, tip){
  const beyond = n >= 5, on = beyond ? 4 : (n||0);
  return `<span class="rungs${beyond?" beyond":""}" aria-hidden="true">${[1,2,3,4].map(i=>`<i class="${i<=on?"on":""}"></i>`).join("")}</span>`;
}
function diffOf(it, ctx){
  const d = it.difficulty || {};
  const n = (ctx && d[ctx]) || d._ || Math.min(it.level||0, 4);
  return n ? Math.max(1, Math.min(4, n)) : 0;
}
function ctxName(key){
  if(!key) return "";
  const [k, id] = key.split(":");
  if(k==="track"){ const t = trackOf(id); return t ? (t.short||t.title) : id; }
  if(k==="idea"){ const i = ideaOf(id); return i ? i.title : id; }
  if(k==="theme"){ const t = themeOf(id); return t ? t.label : id; }
  return "";
}
function diffBadge(n, ctx, showCtx){
  if(!n) return "";
  const where = ctx ? ctxName(ctx) : "";
  const tip = `${DIFF[n]} (${n}/4) — ${DIFF_HINT[n]}${where?` · relative to “${where}”`:""}`;
  return `<span class="diff d${n}" title="${esc(tip)}">${rungs(n)}${DIFF[n]}${showCtx&&where?`<span class="ctx">· ${esc(where)}</span>`:""}</span>`;
}
function trackMembers(t){
  const legacy = items.filter(i=>i.kind!=="idea" && i.trackId===t.id)
    .sort((a,b)=>((a.level||0)-(b.level||0))||((a.num??999)-(b.num??999)))
    .map(i=>({it:i, step:i.level||0, num:i.num}));
  const seen = new Set(legacy.map(m=>m.it.id));
  const refs = (t.items||[]).map(r=>({it:items.find(i=>i.id===r.id), step:r.step||0})).filter(m=>m.it && !seen.has(m.it.id));
  const all = legacy.concat(refs);
  all.forEach((m,k)=>{ if(m.num==null) m.num = k+1; });
  return all;
}
function tracksOf(it){
  return tracks.filter(t => it.trackId===t.id || (t.items||[]).some(r=>r.id===it.id));
}
function stepOf(t, it){
  if(it.trackId===t.id) return it.level||0;
  return ((t.items||[]).find(r=>r.id===it.id)||{}).step||0;
}
function contextsOf(it){
  const keys = [];
  for(const t of tracksOf(it)) keys.push("track:"+t.id);
  if(ideaOf(it.ideaId)) keys.push("idea:"+it.ideaId);
  for(const th of themeIds(it)) keys.push("theme:"+th);
  return keys;
}
function diffSummary(it){
  const ctxs = contextsOf(it);
  if(!ctxs.length) return diffOf(it) ? `<div class="difflist"><span class="lbl">Difficulty</span>${diffBadge(diffOf(it))}</div>` : "";
  const vals = ctxs.map(c=>[c, diffOf(it,c)]).filter(([,n])=>n);
  if(!vals.length) return "";
  const same = vals.every(([,n])=>n===vals[0][1]);
  if(same) return `<div class="difflist"><span class="lbl">Difficulty</span>${diffBadge(vals[0][1])}<span>in every context (${vals.map(([c])=>esc(ctxName(c))).join(", ")})</span></div>`;
  return `<div class="difflist"><span class="lbl">Difficulty by context</span>${vals.map(([c,n])=>diffBadge(n,c,true)).join("")}</div>`;
}
const FORM_STATUS = {todo:"To do", reading:"In progress", skimmed:"Quick pass", done:"Done"};
function ibxBtn(label, req, title){
  return `<button class="btn ghost ibx" data-inbox="${esc(JSON.stringify(req))}" title="${esc(title||"Send this to the inbox (pre-filled GitHub issue)")}">${esc(label)}</button>`;
}
function srcShortcuts(it){                         // replaces the status pill's select and Remove (kit §23.3)
  if(it.status==="suggested") return `<div class="ibxs">${ibxBtn("Keep it…", {type:"Change status", target:it.id, status:"To do"})}</div>`;
  const opts = [["done","Done"],["reading","In progress"],["skimmed","Quick pass"]].filter(([k])=>k!==it.status);
  return `<div class="ibxs">${opts.map(([k,l])=>ibxBtn(l+"…", {type:"Change status", target:it.id, status:FORM_STATUS[k]})).join("")}${ibxBtn("Attach…", {type:"Attach", target:it.id}, "Attach this source to a concept or a track")}</div>`;
}
function statusSelect(it){
  const map = it.kind === "idea" ? IDEA_STATUS : STATUS;
  if(RO) return `<span class="status spill" data-s="${esc(it.status)}">${esc(map[it.status]||it.status||"")}</span>`;
  return `<select class="status" data-s="${esc(it.status)}" data-id="${esc(it.id)}" aria-label="Status of ${esc(it.title)}">${Object.entries(map).map(([k,v])=>`<option value="${k}"${k===it.status?" selected":""}>${v}</option>`).join("")}</select>`;
}
function removeCtl(it){
  if(RO) return "";
  return openRemove.has(it.id)
    ? `<button class="btn danger" data-del="${esc(it.id)}">Confirm remove</button><button class="btn ghost" data-cancel="${esc(it.id)}">Keep</button>`
    : `<button class="btn ghost" data-ask="${esc(it.id)}">Remove</button>`;
}
function sourceRow(it, ctx, num){
  const showTrack = ctx === null;
  const trs = tracksOf(it);
  const t = trs[0];
  const title = it.url ? `<a href="${esc(it.url)}" target="_blank" rel="noopener">${esc(it.title)}</a>` : `<span class="tt">${esc(it.title)}</span>`;
  const chips = [
    it.author ? `<span>${esc(it.author)}</span>` : "",
    it.year ? `<span class="prio">${esc(it.year)}</span>` : "",
    `<span class="chip">${esc(FORMATS[it.format]||it.format||"")}</span>`,
    it.duration ? `<span class="chip">${esc(it.duration)}</span>` : "",
    it.lang ? `<span class="chip lang">${esc(it.lang)}</span>` : "",
    it.core ? `<span class="chip core" title="Part of the minimal path">minimal path</span>` : "",
    it.verified === false ? `<span class="chip warn" title="Link given from memory, not checked">link unverified</span>` : "",
    !it.url ? `<span class="chip">no link</span>` : "",
    showTrack ? trs.map(tr=>`<button class="chip trk" data-opentrack="${esc(tr.id)}" title="Open this track">${esc(tr.short||tr.title)} · step ${esc(stepOf(tr,it))}</button>`).join("") : "",
    showTrack && !t && ideaOf(it.ideaId) ? `<span class="chip">idea: ${esc(ideaOf(it.ideaId).title)}</span>` : "",
    themeChips(it),
  ].join("");
  const tags = (it.tags||[]).map(x=>`<span class="tag">${esc(x)}</span>`).join("");
  const links = (it.links||[]).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.label)} ↗</a>`).join("");
  return `<div class="row${it.status==="done"?" is-done":""}" id="row-${esc(it.id)}">
    <div class="num">${(num??it.num)!=null?String(num??it.num).padStart(2,"0"):"·"}</div>
    <div class="main">
      ${ctx ? `<div class="lead">${diffBadge(diffOf(it,ctx), ctx)}</div>` : ""}
      <div class="title">${title} ${newChip(view, it)}</div>
      <div class="meta">${chips}</div>
      ${ctx===null ? diffSummary(it) : ""}
      ${ctx==="" ? ownChips(it) : ""}
      ${it.prereq?`<p class="prereq"><b>Prerequisites:</b> ${esc(it.prereq)}</p>`:""}
      ${it.note?`<p class="note">${esc(it.note)}</p>`:""}
      ${links?`<div class="links">${links}</div>`:""}
      ${tags?`<div class="tags">${tags}</div>`:""}
    </div>
    <div class="side">${it.status==="suggested"
      ? (RO ? `<span class="chip sugg">Suggested</span>${srcShortcuts(it)}` : `<span class="chip sugg">Suggested</span><div class="actions"><button class="btn accept" data-accept="${esc(it.id)}">Accept</button><button class="btn ghost" data-dismiss="${esc(it.id)}">Dismiss</button></div>`)
      : `${statusSelect(it)}<div class="actions">${RO ? srcShortcuts(it) : removeCtl(it)}</div>`}</div>
  </div>`;
}

const SRC_TYPE = {primary:"Primary", journal:"Journal", press:"Press", x:"X"};
const CAT_ORDER = ["Models & releases","Research","Science","Industry & business","Hardware & infra","Policy & safety","Other"];
function fmtDay(id, short){
  const d = new Date(id+"T00:00:00");
  if(isNaN(d)) return id;
  return d.toLocaleDateString("en-GB", short ? {day:"numeric", month:"short"} : {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}
const newsItem = nid => items.find(i=>i.newsId===nid);
let archiveOpen = false, archiveQ = "", flashNews = "";
function refLabel(date, k){
  const d = digests.find(x=>x.id===date); const n = d && (d.items||[])[+k];
  return n ? n.title : fmtDay(date,true);
}
function richText(t){
  // [[YYYY-MM-DD#k]] or [[YYYY-MM-DD#k|label]] → link into the archive
  return esc(t||"").replace(/\[\[(\d{4}-\d{2}-\d{2})#(\d+)(?:\|([^\]]+))?\]\]/g, (m, date, k, label) =>
    `<button class="linkish ref" data-newsref="${date}|${k}" title="Open in archive (${fmtDay(date,true)})">${label || esc(refLabel(date,k))} ↩</button>`);
}
function newsActions(did, k){
  const nid = did+"-"+k, li = newsItem(nid);
  if(RO){
    if(!li) return ibxBtn("Save…", {type:"Add source", target:nid, status:"To do"}, "Save this news to your ledger")+ibxBtn("✓ Done…", {type:"Add source", target:nid, status:"Done"}, "Save it, already done");
    if(li.status==="done" || li.status==="skimmed") return `<span class="chip readchip">✓ Done</span>`;
    return `<span class="chip">In ledger</span>`+ibxBtn("✓ Done…", {type:"Change status", target:li.id, status:"Done"});
  }
  if(!li) return `<button class="btn ghost" data-savenews="${esc(did)}|${k}|todo" title="Add to your ledger as 'To do'">+ Ledger</button><button class="btn ghost" data-savenews="${esc(did)}|${k}|done" title="Add to your ledger, already done">✓ Done</button>`;
  if(li.status==="done" || li.status==="skimmed") return `<span class="chip readchip">✓ Done</span>`;
  return `<span class="chip">In ledger</span><button class="btn ghost" data-readnews="${esc(li.id)}" title="Mark as done">✓ Done</button>`;
}
function srcLinks(n){ return (n.sources||[]).map(x=>`<a href="${esc(x.url)}" target="_blank" rel="noopener"><span class="stype ${esc(x.type||"press")}">${esc(SRC_TYPE[x.type]||"Source")}</span>${esc(x.label||"link")}</a>`).join(""); }
function relatedLinks(n){
  return (n.related||[]).length ? `<p class="related">See also: ${(n.related||[]).map(r=>`<button class="linkish ref" data-newsref="${esc(r.date)}|${esc(r.index)}">${esc(r.label||refLabel(r.date,r.index))} <span class="prio">${esc(fmtDay(r.date,true))}</span></button>`).join(" · ")}</p>` : "";
}
const CRIT = [["capability","Capability shift"],["reach","Reach"],["durability","Durability"],["reliability","Reliability"]];
function nScore(n){ if(typeof n.score==="number") return n.score; if(n.scores) return CRIT.reduce((a,[k])=>a+(+n.scores[k]||0),0); return n.importance ? (n.importance===3?6:n.importance===2?4:2) : 0; }
function scoreBadge(n){
  if(!n.scores && typeof n.score!=="number") return "";
  const tip = n.scores ? CRIT.map(([k,l])=>`${l}: ${n.scores[k]??"–"}/2`).join(" · ") : "";
  return `<span class="score" title="${esc(tip)}">${nScore(n)}/8</span>`;
}
function dots(n){ const v = nScore(n); return v>=6?'<span class="imp" title="Major">●●●</span>':v>=4?'<span class="imp mid" title="Notable">●●</span>':'<span class="imp low" title="Worth knowing">●</span>'; }
// ---------- shared news rendering: weight follows the score ----------
function shortTitle(t, max){
  let s = String(t||"").split(/[:—]/)[0].trim();
  if(s.length<=max) return s;
  s = s.slice(0, max);
  const i = s.lastIndexOf(" ");
  return (i>max*0.5 ? s.slice(0,i) : s).replace(/[,;:]$/,"")+"…";
}
const nW = n => { const v = nScore(n); return v>=6 ? "w-hot" : v>=4 ? "w-warm" : "w-cool"; };
const nSaved = (did,k) => newsItem(did+"-"+k);
function critTip(n){ return n.scores ? CRIT.map(([k,l])=>`${l}: ${n.scores[k]??"–"}/2`).join(" · ")+` — total ${nScore(n)}/8` : ""; }
function dotsOf(n){
  const v = nScore(n), c = v>=6?"":v>=4?" mid":" low", g = v>=6?"●●●":v>=4?"●●":"●";
  return `<span class="imp${c}" title="${esc(critTip(n)||(v>=6?"Major":v>=4?"Notable":"Worth knowing"))}">${g}</span>`;
}
function newsRow(n, did, k, q, showDate){
  const w = nW(n), li = nSaved(did,k), read = li && (li.status==="done"||li.status==="skimmed");
  const cat = n.category||"Other";
  return `<article class="nrow ${w}${read?" is-seen":""}" id="news-${esc(did)}-${k}">
    <div class="nmain">
      <div class="nhead">${dotsOf(n)}<h3>${hl(n.title,q)}</h3></div>
      <div class="nmeta">
        <button class="chip ncat" data-ncat="${esc(cat)}" title="Only this category">${esc(cat)}</button>
        ${showDate?`<button class="chip nday" data-digest="${esc(did)}" title="Open that morning">${esc(fmtDay(did,true))}</button>`:""}
        ${n.late?`<span class="chip">caught late</span>`:""}${n.recap?`<span class="chip">recap</span>`:""}
        ${li?`<span class="chip ${read?"readchip":""}">${read?"✓ in ledger, done":"in ledger"}</span>`:""}
      </div>
      ${w!=="w-cool"?`<p class="news-sum">${q?hl(n.summary,q):richText(n.summary)}</p>${relatedLinks(n)}`:""}
      <div class="news-src">${srcLinks(n)}</div>
    </div>
    <div class="nact">${newsActions(did,k)}</div>
  </article>`;
}

// ---------- TODAY ----------
let byCat = store.get("ll.byCat", false);
const briefsOpen = new Set(store.get("ll.briefs", []));
function renderToday(){
  const el = $("#view-today");
  if(!digests.length){ el.innerHTML = `<div class="empty"><h3>No digest yet</h3>The morning briefing appears here every day at 7:00 (Tokyo).</div>`; return; }

  const list = (d.items||[]).map((n,k)=>({n,k}));

  const hero = top.length ? `<section class="hero" aria-label="Top stories">
      <p class="hero-label">Top ${top.length} today</p>
      <div class="hero-grid">${top.map((x,i)=>`<article class="hcard${flashNews===d.id+"-"+x.k?" flash":""}" id="news-${esc(d.id)}-${x.k}">
        <span class="hrank">${i+1}</span>
        <div class="hbody">
          <p class="hcat">${esc(x.n.category||"")} ${dotsOf(x.n)}</p>
          <h3>${esc(x.n.title)}</h3>
          <p class="news-sum">${richText(x.n.summary)}</p>
          ${relatedLinks(x.n)}
          <div class="news-src">${srcLinks(x.n)}</div>
          <div class="news-foot"><span class="acts">${newsActions(d.id,x.k)}</span></div>
        </div>
      </article>`).join("")}</div>
    </section>` : "";
  // the whole day in one line, before any scrolling
  const index = list.length>3 ? `<nav class="dayindex" aria-label="Everything in today's briefing">
      ${list.map(({n,k})=>`<button class="dix ${nW(n)}${nSaved(d.id,k)?" has":""}" data-godx="${esc(d.id)}|${k}" title="${esc(n.title)} — ${esc(n.category||"")}">

let archQ = "", archGroup = store.get("ll.archGroup","day"), archCat = "", archUnread = false;
const archClosed = new Set(store.get("ll.archClosed", []));
function archRows(){
  const out = [];
  for(const d of digests) (d.items||[]).forEach((n,k)=>out.push({d, n, k}));
  return out;
}
function renderArchiveView(){
  const el = $("#lib-list");

  if(q) rows = rows.filter(r=>[r.n.title, r.n.summary, r.n.category].join(" ").toLowerCase().includes(q));
  if(archCat) rows = rows.filter(r=>(r.n.category||"Other")===archCat);
  if(archUnread) rows = rows.filter(r=>{ const li = nSaved(r.d.id, r.k); return !li || !(li.status==="done"||li.status==="skimmed"); });
  $("#arch-count").textContent = rows.length===total ? total+" items" : rows.length+" of "+total;
  [...document.querySelectorAll("#archgroup button")].forEach(b=>b.setAttribute("aria-pressed", String(b.dataset.agroup===archGroup)));
  $("#arch-cat").value = archCat; $("#arch-unread").checked = archUnread;
  const qi = $("#arch-q"); if(document.activeElement !== qi && qi.value !== archQ) qi.value = archQ;
  // 30 most recent days, one dot each, sized by that day's best score
  $("#arch-spark").innerHTML = digests.slice(0,30).map(d=>{
    const best = Math.max(0, ...(d.items||[]).map(nScore));
    const top = (d.items||[]).find(n=>n.rank===1) || (d.items||[])[0] || {};
    return `<button class="sday s${best>=7?3:best>=5?2:1}" data-digest="${esc(d.id)}" title="${esc(fmtDay(d.id))} — ${(d.items||[]).length} items · best ${best}/8${top.title?" · "+esc(top.title):""}"><i></i><span>${esc(fmtDay(d.id,true).split(" ")[0])}</span></button>`;
  }).reverse().join("");
  if(!rows.length){ el.innerHTML = `<div class="empty"><h3>Nothing matches</h3>Loosen a filter or clear the search.</div>`; return; }
  const band = (key, head, list, dflt) => {
    const closed = archClosed.has(key) || (dflt && !archClosed.has("!"+key));
    return `<section class="nband">
      <button class="bandhead" data-aband="${esc(key)}" aria-expanded="${!closed}">
        <span class="caret">${closed?"▸":"▾"}</span>${head}<span class="rule"></span><span class="bsub">${list.length}</span></button>
      ${closed?"":`<div class="nlist">${list.map(r=>newsRow(r.n, r.d.id, r.k, q, archGroup!=="day")).join("")}</div>`}
    </section>`;
  };
  const H = (name, sub, extra) => `<span class="bname">${esc(name)}</span>${sub?`<span class="bdesc">${esc(sub)}</span>`:""}${extra||""}`;
  let out = "";
  if(archGroup==="day"){
    const days = [...new Set(rows.map(r=>r.d.id))];
    out = days.map((id,i)=>{ const list = rows.filter(r=>r.d.id===id).sort((a,b)=>nScore(b.n)-nScore(a.n));
      const best = Math.max(0,...list.map(r=>nScore(r.n)));
      return band("d:"+id, H(fmtDay(id), list[0]?.n.title||"", `<span class="bsub">best ${best}/8</span>`), list, i>0 && !q); }).join("");
  } else if(archGroup==="month"){
    const key = r => r.d.id.slice(0,7);
    const months = [...new Set(rows.map(key))];
    out = months.map((m,i)=>{ const list = rows.filter(r=>key(r)===m).sort((a,b)=>String(b.d.id).localeCompare(String(a.d.id)) || nScore(b.n)-nScore(a.n));
      const dd = new Date(m+"-01T00:00:00");
      return band("m:"+m, H(isNaN(dd)?m:dd.toLocaleDateString("en-GB",{month:"long", year:"numeric"}), [...new Set(list.map(r=>r.d.id))].length+" mornings"), list, i>0 && !q); }).join("");
  } else if(archGroup==="cat"){
    const order = c => { const i = CAT_ORDER.indexOf(c); return c==="Beyond AI" ? 999 : i<0 ? 900 : i; };
    const cats = [...new Set(rows.map(r=>r.n.category||"Other"))].sort((a,b)=>order(a)-order(b));
    out = cats.map(c=>{ const list = rows.filter(r=>(r.n.category||"Other")===c).sort((a,b)=>nScore(b.n)-nScore(a.n) || String(b.d.id).localeCompare(String(a.d.id)));
      return band("c:"+c, H(c, ""), list, !q); }).join("");
  } else {
    const bands = [["s3","Major","6 to 8 — turning points", r=>nScore(r.n)>=6],
                   ["s2","Notable","4 to 5", r=>nScore(r.n)>=4 && nScore(r.n)<6],
                   ["s1","Worth knowing","3 or less", r=>nScore(r.n)<4]];
    out = bands.map(([k,name,sub,f])=>{ const list = rows.filter(f).sort((a,b)=>nScore(b.n)-nScore(a.n) || String(b.d.id).localeCompare(String(a.d.id)));
      return list.length ? band(k, H(name, sub), list, k==="s1" && !q) : ""; }).join("");
  }
  el.innerHTML = out;
}

let kHideDone = store.get("ll.kHideDone", false);
const kOpen = new Set(store.get("ll.kOpen", []));
let progSel = store.get("ll.prog", "");
const DEFAULT_PROG = {id:"kaggle", title:"Kaggle Learn", eyebrow:"Courses", unit:"course", step:"lesson", order:1,
  blurb:"Free Kaggle Learn micro-courses in a suggested order. Tick lessons as you finish them on Kaggle; progress is saved here.",
  url:"https://www.kaggle.com/learn"};
function progList(){
  const ids = [...new Set(kcourses.map(c=>c.programme||"kaggle"))];
  return ids.map(id => Object.assign({}, id==="kaggle"?DEFAULT_PROG:{id, title:id, unit:"unit", step:"step", order:99},
                                     programmes.find(p=>p.id===id)||{}, {id}))
            .sort((a,b)=>(a.order??99)-(b.order??99));
}
const unitsOf = pid => kcourses.filter(c=>(c.programme||"kaggle")===pid).sort((a,b)=>(a.order??99)-(b.order??99));
function kStatus(c){
  const n = (c.lessons||[]).length, d = (c.done||[]).length;
  if(n && d>=n) return "done"; if(d>0) return "progress"; return "todo";
}
function medWeight(cs){
  const all = [];
  cs.forEach(c=>{ if(Array.isArray(c.weights)) c.weights.forEach(x=>{ if(+x>0) all.push(+x); }); });
  if(!all.length) return 1;
  all.sort((a,b)=>a-b); return all[Math.floor(all.length/2)];
}
function wOf(c, med){                                   // weights per lesson, imputed when the unit has none
  const n = (c.lessons||[]).length;
  if(Array.isArray(c.weights) && c.weights.length===n && c.weights.some(x=>+x>0)) return {w:c.weights.map(x=>+x||0), est:false};
  return {w:new Array(n).fill(med||1), est:true};
}
function unitProg(c, med){
  const {w, est} = wOf(c, med);
  const total = w.reduce((a,b)=>a+b,0);
  const done = (c.done||[]).reduce((a,k)=>a+(w[k]||0),0);
  return {w, est, done, total, pct: total ? done/total*100 : 0};
}
function fmtW(v, unit){
  v = unit==="page" && Math.abs(v)<20 && v%1 ? Math.round(v*(Math.abs(v)<1?100:10))/(Math.abs(v)<1?100:10) : Math.round(v);
  if(unit==="min"){ if(v<60) return v+" min"; const h=Math.floor(v/60), m=v%60; return m ? h+" h "+String(m).padStart(2,"0") : h+" h"; }
  if(unit==="word"){ return v>=10000 ? (v/1000).toFixed(v>=100000?0:1).replace(/\.0$/,"")+"k words" : v.toLocaleString("en-GB")+" words"; }
  return v.toLocaleString("en-GB")+(unit?" "+unit+(Math.abs(v)===1?"":"s"):"");
}
function progStats(pid){
  const cs = unitsOf(pid);
  const tot = cs.reduce((a,c)=>a+(c.lessons||[]).length,0), dn = cs.reduce((a,c)=>a+(c.done||[]).length,0);
  const xt = cs.reduce((a,c)=>a+(c.extras||[]).length,0), xd = cs.reduce((a,c)=>a+(c.doneX||[]).length,0);
  const med = medWeight(cs);
  let wDone = 0, wTot = 0, anyEst = false;
  cs.forEach(c=>{ const u = unitProg(c, med); wDone += u.done; wTot += u.total; if(u.est && (c.lessons||[]).length) anyEst = true; });
  return {cs, tot, dn, xt, xd, med, wDone, wTot, anyEst,
          pct: wTot ? Math.round(wDone/wTot*100) : (tot?Math.round(dn/tot*100):0),
          pctCount: tot?Math.round(dn/tot*100):0,
          fin: cs.filter(c=>kStatus(c)==="done").length, certs: cs.filter(c=>c.certificate).length};
}

async function syncSource(c){                       // a finished chapter marks its source read in the ledger
  if(!db || !c || !c.sourceId) return;
  const it = items.find(i=>i.id===c.sourceId); if(!it) return;
  const n = (c.lessons||[]).length, d = (c.done||[]).length;

const lastSeen = store.get("ll.seen", null) || (()=>{ const now = new Date().toISOString(), o = {}; ["today","paths","library","concepts"].forEach(k=>o[k]=now); store.set("ll.seen", o); return o; })();
const seenSnap = {};

function tabDocs(v){
  if(typeof v==="string" && v.startsWith("topic:")){
    const id = v.slice(6), t = trackOf(id);
    return (t?[t]:[]).concat(papersOf(id), items.filter(i=>(t && t.items||[]).some(r=>r.id===i.id)));

    case "today": return digests;

// "Seen" is tracked by signature (doc id + its Claude timestamp), not by comparing clocks:
// Claude's timestamps can be in another timezone or ahead of this device's clock.
const sig = d => { const t = agentTs(d); return t ? d.id+"@"+t : ""; };

const seenSigSnap = {};

function seenSet(v){ return new Set((seenSigs && seenSigs[v]) || []); }
function markSeen(v){
  const cur = tabDocs(v).map(sig).filter(Boolean);
  seenSigs[v] = [...new Set([...(seenSigs[v]||[]), ...cur])].slice(-3000);
}
function initSeen(){
  if(seenSigs && !seenSigs.library){                     // migrate from the old six-tab layout
    const u = (...ks) => [...new Set(ks.flatMap(k=>seenSigs[k]||[]))];
    seenSigs.paths = u("paths","learning","tracks"); seenSigs.library = u("library","all","themes"); seenSigs.concepts = u("concepts","ideas");
    store.set("ll.seenSigs", seenSigs);
  }
  if(seenSigs) return true;
  // first run in this browser: everything that exists now counts as seen (no flood of dots)
  if(!["items","tracks","themes","digests","kaggle","programmes"].every(c=>loadedCols.has(c))) return false;  // wait until every collection has loaded once
  seenSigs = {}; ["today","paths","library","concepts"].forEach(markSeen);
  store.set("ll.seenSigs", seenSigs); return true;
}
const isNewFor = (v, d) => {
  const g = sig(d), known = seenSigSnap[v] || seenSet(v);
  return (!!g && !!seenSigs && !known.has(g)) || (v==="paths" && d.id && landedNew(d.id,"paths"));
};
function updateDots(){
  const now = new Date().toISOString();
  if(!initSeen()) return;
  if(String(view).startsWith("topic:") && !loadedCols.has("papers")) return;   // wait for the literature before taking a baseline
  if(seenSigSnap[view] === undefined) seenSigSnap[view] = seenSet(view);
  if(seenSnap[view] === undefined) seenSnap[view] = lastSeen[view] || "";
  markSeen(view); lastSeen[view] = now;
  for(const v of ["today","paths","library","concepts"].concat(topicTracks().map(t=>"topic:"+t.id))){
    const isT = v.startsWith("topic:");
    if(isT && !seenSigs[v]){ if(!loadedCols.has("papers")) continue; markSeen(v); }   // a new topic tab starts clean: no flood of "New" chips
    const el = isT ? [...document.querySelectorAll("nav.tabs button.topictab")].find(b=>b.dataset.view===v)?.querySelector(".tdot")
                   : document.getElementById("dot-"+v);
    if(!el) continue;
    const known = seenSet(v);
    const agentNew = v!==view && tabDocs(v).some(d=>{ const g = sig(d); return g && !known.has(g); });
    const landNew = v==="paths" && v!==view && landed.some(l=>l.at > (lastSeen.paths||""));
    const pending = v==="concepts" ? items.filter(i=>i.status==="suggested").length : 0;
    el.classList.toggle("pend", !!pending && !agentNew);
    el.title = agentNew ? "New changes by Claude" : pending ? pending+" suggestion(s) waiting for Accept / Dismiss" : "";
    el.hidden = !(pending || agentNew || landNew);
  }
  store.set("ll.seenSigs", seenSigs); store.set("ll.seen", lastSeen);
}

  if(topicArea && !areas.some(([a])=>a===topicArea)) areas.push([topicArea, 0]);   // keep the active filter clearable

      <span class="count" id="topic-count"></span>
    </div>
    <div class="tareas">${areas.map(([a,c])=>`<button class="chip parea${topicArea===a?" on":""}" data-parea="${esc(a)}">${esc(a)} <span class="prio">${c}</span></button>`).join("")}</div>
    <div id="topic-list"></div>`;

}
function renderTopicList(){

  const mode = topicMode(t.id), q = topicQ.trim().toLowerCase(), since = (t.lit||{}).since || "2024-10";

  const byDate = (a,b)=>String(b.date).localeCompare(String(a.date)) || String(a.title).localeCompare(String(b.title));
  const band = (key, name, sub, list, folded) => {
